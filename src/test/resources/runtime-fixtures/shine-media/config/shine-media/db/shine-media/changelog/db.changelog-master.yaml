      changes:
        - sql:
            sql: |
              UPDATE roles SET name = '__SWAP__' WHERE id = 1 AND name = 'SALES_MANAGER';
              UPDATE roles SET name = 'SALES_MANAGER' WHERE id = 2 AND name = 'ADMIN';
              UPDATE roles SET name = 'ADMIN' WHERE id = 1 AND name = '__SWAP__';
        - sql:
            sql: |
              UPDATE user_roles
              SET role_id = CASE role_id WHEN 1 THEN 2 WHEN 2 THEN 1 ELSE role_id END
              WHERE role_id IN (1, 2)
                AND EXISTS (SELECT 1 FROM roles WHERE id = 1 AND name = 'ADMIN')
                AND EXISTS (SELECT 1 FROM roles WHERE id = 2 AND name = 'SALES_MANAGER')
                AND EXISTS (
                  SELECT 1 FROM user_roles ur
                  INNER JOIN users u ON u.id = ur.user_id
                  WHERE u.username = 'admin' AND ur.role_id = 2
                );
