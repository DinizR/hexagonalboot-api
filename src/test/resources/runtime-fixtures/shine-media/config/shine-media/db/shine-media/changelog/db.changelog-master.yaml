              - column:
                  name: uploaded_by_user_id
                  type: INT
        - createIndex:
            tableName: insertion_media_contents
            indexName: idx_insertion_media_contents_slot_id
            columns:
              - column:
                  name: inventory_slot_id
        - addForeignKeyConstraint:
            baseTableName: insertion_media_contents
            baseColumnNames: inventory_slot_id
            referencedTableName: inventory_slots
            referencedColumnNames: id
            constraintName: fk_insertion_media_contents_slot
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('insertion-media-content:upload'),
                ('insertion-media-content:download'),
                ('insertion-media-content:list-for-slot')
              ) AS v(permission_code)
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                );

  - changeSet:
      id: 68
      author: porto-api
      comment: >
        Scheduled job management: persist jobId, Quartz cron, and key/value parameters.
        Host provisions RAM Quartz from these rows; scheduled-jobs plugins implement the work.
      changes:
        - createTable:
            tableName: scheduled_jobs
