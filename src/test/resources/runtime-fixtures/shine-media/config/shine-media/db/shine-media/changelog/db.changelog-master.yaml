              Conceitos (Lei 8.471):
              - Letreiro: identificação no próprio local da atividade (nome, marca/logotipo, atividade principal, endereço/telefone);
              - Anúncio: referência a produtos, serviços ou atividades em local estranho ao exercício da atividade (placas, cartazes, painéis etc.);
              - Publicidade visível ao público, em regra, depende de licença precária (alvará) da SMU.
              
              Destaques do Decreto 976/2024 para anúncios estáticos:
              - classes de dimensão para painéis com estrutura própria no solo (tipos A/B/C, faixas de área até cerca de 32 m²);
              - área máxima relacionada à testada do lote (regra da testada × 1,60 m);
              - classes de tecnologia incluem estático iluminado / não iluminado (LED tratado à parte — ver regulamento DOOH);
              - a Lei 8.471 historicamente veda distribuição manual de volantes/folhetos e a maior parte da publicidade móvel (exceto letreiros) — confirmar regra vigente antes de ações de rua.
              
              Nota operacional: veicular OOH estático em Curitiba somente com Alvará de Publicidade válido para o anúncio específico; protocolar pelo Portal de Serviços e verificar classe de área/testada no Decreto 976.'
              WHERE city_id = (SELECT id FROM cities WHERE name = 'Curitiba' AND country = 'BR')
                AND media_channel_id = (SELECT id FROM media_channels WHERE name = 'OOH (Static)')
        - sql:
            sql: |
              UPDATE city_regulations
              SET regulations = 'Prefeitura Municipal de Curitiba — mídia exterior digital (DOOH) / painéis de LED ou tecnologia similar.
              
              Base legal: Lei Municipal nº 8.471/1994; Decreto Municipal nº 976/2024 (classe tecnológica “LED ou tecnologia similar” e critérios do art. 45); Distrito de Mídia da Rua Marechal Deodoro (Decreto nº 1.871/2024) para formatos luminosos/inovadores naquele distrito; Alvará de Publicidade via Portal de Serviços.
              
              Critérios do Decreto 976 para LED / similar (resumo):
              - controle de intensidade luminosa para não gerar incômodo a pedestres e ao trânsito, independentemente da direção do painel;
              - proibidos efeitos estroboscópicos ou equivalentes que perturbem o trânsito;
              - permanecem classificações de tipo/área e regras de testada quando aplicáveis;
              - exigido alvará prévio; a análise da SMU segue os critérios técnicos do Decreto 976.
              
              Distrito de Mídia (Marechal Deodoro): regime especial para publicidade de grandes proporções e inovação tecnológica (empenas/topo etc. sob critérios do distrito), ainda sujeito a Alvará de Publicidade e às vedações da Lei 8.471 que permaneçam vigentes.
              
              Nota operacional: Curitiba admite DOOH/LED regulado (diferente da restrição ampla de São Paulo). Confirmar o local, obter alvará, configurar controle de luminância e verificar se a face está no Distrito de Mídia da Marechal Deodoro.'
              WHERE city_id = (SELECT id FROM cities WHERE name = 'Curitiba' AND country = 'BR')
                AND media_channel_id = (SELECT id FROM media_channels WHERE name = 'DOOH')
        - sql:
            sql: |
              UPDATE city_regulations
              SET regulations = 'Prefeitura Municipal de Ponta Grossa — publicidade exterior (OOH estático / anúncios).
              
              Base legal: normas municipais de edificações/publicidade (linha do Código de Obras, inclusive Lei Ordinária nº 9.875/2009; historicamente Lei nº 6.327/1999). O Projeto de Lei 474/2025 (Mensagem 132/2025), sobre marco regulatório de mídias exteriores (outdoors, LED, empenas cegas, publicidade em logradouro), tramitava na Câmara em 2025–2026 — confirmar se foi sancionado antes de se apoiar no texto do projeto.
              
              Marco operacional atual (resumo Código de Obras / Lei 9.875):
              - “anúncio” abrange publicidade visível dos logradouros: placas, tabuletas, murais, letreiros, logomarcas, adesivos etc.;
              - regras típicas de área máxima (fórmula frente à edificação/testada), avanço máximo em relação ao alinhamento predial (cerca de 1,20 m), altura mínima sobre o passeio quando houver saliência (cerca de 3 m) e restrições a obstrução de aberturas/marquises;
              - placas móveis no passeio são restringidas; braços/saliências luminosas devem respeitar os mesmos limites de avanço.
              
              PL 474/2025 (monitorar): pretende modernizar o marco para LED, empenas cegas, publicidade temporária de obra e formatos em espaço público, com taxas de licenciamento — tratar como proposta até publicação como lei.
              
              Nota operacional: para OOH estático em Ponta Grossa, licenciar sob as regras vigentes do Código de Obras/publicidade e acompanhar o PL 474/2025; obter alvará/autorização municipal antes da instalação.'
              WHERE city_id = (SELECT id FROM cities WHERE name = 'Ponta Grossa' AND country = 'BR')
                AND media_channel_id = (SELECT id FROM media_channels WHERE name = 'OOH (Static)')
        - sql:
            sql: |
              UPDATE city_regulations
              SET regulations = 'Prefeitura Municipal de Ponta Grossa — mídia exterior digital (DOOH) / painéis eletrônicos de LED.
              
              Base legal: as normas mais antigas de anúncios do Código de Obras / publicidade (linha da Lei 6.327/1999 e atualizações como a Lei 9.875/2009) antecedem os painéis eletrônicos de grande porte. O Projeto de Lei 474/2025 (Mensagem 132/2025) busca regulamentar expressamente painéis de LED, empenas cegas e novas tipologias, taxas e mídia em logradouro público — ainda sujeito a debate/emendas na Câmara conforme relatos de 2025–2026.
              
              Postura prática até vigência de lei nova:
              - não presumir que outdoors de LED são livremente permitidos; obter orientação escrita do órgão municipal competente (Urbanismo ou equivalente) antes da veiculação;
              - aplicar, por analogia, regras vigentes de área, avanço, altura e segurança de anúncios quando exigido pela fiscalização;
              - esperar regras futuras específicas para LED (classes, taxas e eventual cessão de espaço para conteúdo institucional — ponto controverso junto a entidades empresariais locais).
              
              Nota operacional: inventário DOOH em Ponta Grossa exige liberação caso a caso; registrar o status do PL 474/2025 em cada booking e manter alvará/evidências em arquivo.'
              WHERE city_id = (SELECT id FROM cities WHERE name = 'Ponta Grossa' AND country = 'BR')
                AND media_channel_id = (SELECT id FROM media_channels WHERE name = 'DOOH')
