                  name: position_label
                  type: VARCHAR(255)
              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: page_from
                  type: INT
              - column:
                  name: page_to
                  type: INT
        - addUniqueConstraint:
            tableName: media_provider_sow_line_positions
            columnNames: media_provider_sow_line_id, position_code
            constraintName: uq_provider_sow_line_position_code
        - addForeignKeyConstraint:
            baseTableName: media_provider_sow_line_positions
            baseColumnNames: media_provider_sow_line_id
            referencedTableName: media_provider_sow_lines
            referencedColumnNames: id
            constraintName: fk_provider_sow_line_positions_line
        - createIndex:
            tableName: media_provider_sow_line_positions
            indexName: idx_provider_sow_line_positions_line
            columns:
              - column:
                  name: media_provider_sow_line_id
        - addColumn:
            tableName: inventory_slots
            columns:
              - column:
                  name: position_code
                  type: VARCHAR(64)
        - addUniqueConstraint:
            tableName: inventory_slots
            columnNames: offering_media_id, slot_date, position_code
            constraintName: uq_inventory_slots_offering_date_position
        - createIndex:
            tableName: inventory_slots
            indexName: idx_inventory_slots_position_code
            columns:
              - column:
                  name: position_code
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('media-provider-sow-line-position:list'),
                ('media-provider-sow-line-position:search'),
                ('media-provider-sow-line-position:read'),
                ('media-provider-sow-line-position:create'),
                ('media-provider-sow-line-position:update'),
                ('media-provider-sow-line-position:delete')
              ) AS v(permission_code)
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                )
        - sql:
            sql: |
              INSERT INTO media_provider_sow_line_positions (
                media_provider_sow_line_id, position_code, position_label, sort_order, page_from, page_to
              )
              SELECT psl.id, v.position_code, v.position_label, v.sort_order, v.page_from, v.page_to
              FROM media_provider_sow_lines psl
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              CROSS JOIN (
                VALUES
                ('COVER', 'Front cover', 1, 1, 1),
                ('IFC', 'Inside front cover', 2, 2, 2),
                ('P3', 'Page 3', 3, 3, 3),
                ('P5', 'Page 5', 4, 5, 5),
                ('DPS_12_13', 'Double-page spread 12-13', 5, 12, 13),
                ('P20', 'Page 20', 6, 20, 20),
                ('P30', 'Page 30', 7, 30, 30),
                ('P40', 'Page 40', 8, 40, 40),
                ('IBC', 'Inside back cover', 9, 59, 59),
                ('OBC', 'Outside back cover', 10, 60, 60)
              ) AS v(position_code, position_label, sort_order, page_from, page_to)
              WHERE mv.name IN (
                'Melbourne Weekly — 60 pages edition',
                'Gazeta do Povo Curitiba — weekend magazine'
              )
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sow_line_positions p
                  WHERE p.media_provider_sow_line_id = psl.id
                    AND p.position_code = v.position_code
                )
        - sql:
            sql: |
              DELETE FROM inventory_slots s
              WHERE s.position_code IS NULL
                AND UPPER(TRIM(s.status)) = 'AVAILABLE'
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_line_positions p
                  WHERE p.media_provider_sow_line_id = s.media_provider_sow_line_id
                )
        - sql:
            sql: |
              INSERT INTO inventory_slots (
                offering_media_id, media_vehicle_id, media_provider_sow_id, media_provider_sow_line_id,
                slot_date, slot_index, position_code, status, insertion_line_id, house_fill_id, held_by, updated_at
              )
              SELECT
                om.id,
                mv.id,
                sow.id,
                psl.id,
                DATEADD('DAY', (week_offset.X - 1) * 7, sow.duration_from),
                p.sort_order,
                p.position_code,
                'AVAILABLE',
                NULL,
                NULL,
                NULL,
                CURRENT_TIMESTAMP
              FROM offering_media om
              INNER JOIN media_provider_sow_lines psl ON psl.id = om.media_provider_sow_line_id
              INNER JOIN media_provider_sows sow ON sow.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              INNER JOIN media_provider_sow_line_positions p ON p.media_provider_sow_line_id = psl.id
              CROSS JOIN SYSTEM_RANGE(1, 120) week_offset
              WHERE UPPER(TRIM(sow.status)) IN ('ACTIVE', 'PENDING')
                AND sow.duration_from IS NOT NULL
                AND sow.duration_to IS NOT NULL
                AND UPPER(TRIM(COALESCE(mv.recurrence, ''))) = 'WEEKLY'
                AND DATEADD('DAY', (week_offset.X - 1) * 7, sow.duration_from) <= sow.duration_to
                AND NOT EXISTS (
                  SELECT 1 FROM inventory_slots s
                  WHERE s.offering_media_id = om.id
                    AND s.slot_date = DATEADD('DAY', (week_offset.X - 1) * 7, sow.duration_from)
                    AND UPPER(TRIM(s.position_code)) = UPPER(TRIM(p.position_code))
                )

  - changeSet:
      id: 33
      author: porto-api
      comment: Rename monthly_price to slot_monthly_price; position capacity; inventory unique includes slot_index
      changes:
        - renameColumn:
            tableName: media_provider_sow_lines
            oldColumnName: monthly_price
            newColumnName: slot_monthly_price
            columnDataType: DECIMAL(19,4)
        - addColumn:
            tableName: media_provider_sow_line_positions
            columns:
              - column:
                  name: capacity
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - dropUniqueConstraint:
            tableName: inventory_slots
            constraintName: uq_inventory_slots_offering_date_position
        - dropUniqueConstraint:
            tableName: inventory_slots
            constraintName: uq_inventory_slots_offering_date_index
        - sql:
            sql: |
              -- Remap positioned slot_index to sort_order*1000 + unit (capacity=1 → +1)
              UPDATE inventory_slots s
              SET slot_index = (
                SELECT p.sort_order * 1000 + 1
                FROM media_provider_sow_line_positions p
                WHERE p.media_provider_sow_line_id = s.media_provider_sow_line_id
                  AND UPPER(TRIM(p.position_code)) = UPPER(TRIM(s.position_code))
              )
              WHERE s.position_code IS NOT NULL
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_line_positions p
                  WHERE p.media_provider_sow_line_id = s.media_provider_sow_line_id
                    AND UPPER(TRIM(p.position_code)) = UPPER(TRIM(s.position_code))
                )
        - addUniqueConstraint:
            tableName: inventory_slots
            columnNames: offering_media_id, slot_date, slot_index
            constraintName: uq_inventory_slots_offering_date_index
        - addUniqueConstraint:
            tableName: inventory_slots
            columnNames: offering_media_id, slot_date, position_code, slot_index
            constraintName: uq_inventory_slots_offering_date_position_index

