                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: cron_expression
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: scheduled_jobs
            indexName: idx_scheduled_jobs_job_id
            columns:
              - column:
                  name: job_id
        - createTable:
            tableName: scheduled_job_parameters
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scheduled_job_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: param_key
                  type: VARCHAR(128)
                  constraints:
