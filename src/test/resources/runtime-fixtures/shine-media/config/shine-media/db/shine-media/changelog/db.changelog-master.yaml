            sql: |
              UPDATE media_vehicles mv
              SET capacity_quantity = 1440,
                  duration_hint = '1 min exclusive inventory; default 3 min insertion'
              WHERE mv.media_channel_id IN (SELECT id FROM media_channels WHERE name = 'DOOH')
                AND mv.operating_from = TIME '00:00:00'
