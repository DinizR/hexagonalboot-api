                );

  - changeSet:
      id: 71
      author: porto-api
      comment: Backfill FORECAST cash-flows for commercial insertion SoWs.
      changes:
        - sql:
            sql: |
              INSERT INTO cash_flows (
                type, account_id, sow_type, sow_id, creation_date, reason_code, transaction_description,
                party_id, due_date, effective_date, original_value, effective_value, user_id, status, series_id, recurrence
              )
              SELECT
                'RECEIVABLE',
                (SELECT id FROM accounts WHERE code = 'INSERTION_REVENUE'),
                'INSERTION',
                s.id,
                CURRENT_TIMESTAMP,
                'INSERTION_INSTALLMENT',
                'Insertion SoW #' || CAST(s.id AS VARCHAR) || ' advertiser receivable 1/1',
                s.party_id,
                s.duration_from,
                NULL,
                ROUND((CASE
                  WHEN COALESCE(n.line_net, 0) - COALESCE(s.discount, 0) < 0 THEN 0
                  ELSE COALESCE(n.line_net, 0) - COALESCE(s.discount, 0)
                END) * (1 + COALESCE(s.tax_rate, 0)), 2),
                NULL,
                s.sales_manager_id,
                'FORECAST',
                'insertion-' || CAST(s.id AS VARCHAR) || '-receivable',
                NULL
              FROM media_insertion_sows s
              INNER JOIN (
                SELECT media_insertion_sow_id AS sow_id,
                       SUM(unit_price * number_of_insertions - COALESCE(discount, 0)) AS line_net
                FROM insertion_lines
                GROUP BY media_insertion_sow_id
              ) n ON n.sow_id = s.id
              WHERE s.status IN ('PENDING_APPROVAL', 'APPROVED', 'PROPOSAL', 'PENDING')
                AND ROUND((CASE
                  WHEN COALESCE(n.line_net, 0) - COALESCE(s.discount, 0) < 0 THEN 0
                  ELSE COALESCE(n.line_net, 0) - COALESCE(s.discount, 0)
                END) * (1 + COALESCE(s.tax_rate, 0)), 2) > 0
                AND NOT EXISTS (
                  SELECT 1 FROM cash_flows cf
                  WHERE cf.sow_type = 'INSERTION' AND cf.sow_id = s.id
                    AND cf.status = 'FORECAST' AND cf.reason_code = 'INSERTION_INSTALLMENT'
                );

              INSERT INTO cash_flows (
                type, account_id, sow_type, sow_id, creation_date, reason_code, transaction_description,
                party_id, due_date, effective_date, original_value, effective_value, user_id, status, series_id, recurrence
              )
              SELECT
                'PAYABLE',
                (SELECT id FROM accounts WHERE code = 'SALES_COMMISSION'),
                'INSERTION',
                s.id,
                CURRENT_TIMESTAMP,
                'SALES_COMMISSION',
                'Insertion SoW #' || CAST(s.id AS VARCHAR) || ' sales commission 1/1',
                NULL,
                s.duration_from,
                NULL,
                ROUND((CASE
                  WHEN COALESCE(n.line_net, 0) - COALESCE(s.discount, 0) < 0 THEN 0
                  ELSE COALESCE(n.line_net, 0) - COALESCE(s.discount, 0)
                END) * CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM insertion_lines l
                    INNER JOIN offering_media o ON o.id = l.offering_media_id
                    INNER JOIN media_provider_sow_lines pl ON pl.id = o.media_provider_sow_line_id
                    INNER JOIN media_provider_sows ps ON ps.id = pl.media_provider_sow_id
                    WHERE l.media_insertion_sow_id = s.id
                      AND ps.contract_type = 'THIRD_PARTY'
                      AND ps.sales_manager_id = s.sales_manager_id
                  ) THEN sc.rate_full_stack
                  ELSE sc.rate_insertion_only
                END, 2),
                NULL,
                s.sales_manager_id,
                'FORECAST',
                'insertion-' || CAST(s.id AS VARCHAR) || '-commission',
                NULL
              FROM media_insertion_sows s
              INNER JOIN (
                SELECT media_insertion_sow_id AS sow_id,
                       SUM(unit_price * number_of_insertions - COALESCE(discount, 0)) AS line_net
                FROM insertion_lines
                GROUP BY media_insertion_sow_id
              ) n ON n.sow_id = s.id
              INNER JOIN commission_allocations ca ON ca.user_id = s.sales_manager_id
              INNER JOIN sales_commissions sc ON sc.id = ca.commission_id
              WHERE s.status IN ('PENDING_APPROVAL', 'APPROVED', 'PROPOSAL', 'PENDING')
                AND s.sales_manager_id IS NOT NULL
                AND ROUND((CASE
                  WHEN COALESCE(n.line_net, 0) - COALESCE(s.discount, 0) < 0 THEN 0
                  ELSE COALESCE(n.line_net, 0) - COALESCE(s.discount, 0)
                END) * CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM insertion_lines l
                    INNER JOIN offering_media o ON o.id = l.offering_media_id
                    INNER JOIN media_provider_sow_lines pl ON pl.id = o.media_provider_sow_line_id
                    INNER JOIN media_provider_sows ps ON ps.id = pl.media_provider_sow_id
                    WHERE l.media_insertion_sow_id = s.id
                      AND ps.contract_type = 'THIRD_PARTY'
                      AND ps.sales_manager_id = s.sales_manager_id
                  ) THEN sc.rate_full_stack
                  ELSE sc.rate_insertion_only
                END, 2) > 0
                AND NOT EXISTS (
                  SELECT 1 FROM cash_flows cf
                  WHERE cf.sow_type = 'INSERTION' AND cf.sow_id = s.id
                    AND cf.status = 'FORECAST' AND cf.reason_code = 'SALES_COMMISSION'
                    AND cf.series_id = 'insertion-' || CAST(s.id AS VARCHAR) || '-commission'
                );

              INSERT INTO cash_flows (
                type, account_id, sow_type, sow_id, creation_date, reason_code, transaction_description,
                party_id, due_date, effective_date, original_value, effective_value, user_id, status, series_id, recurrence
              )
              SELECT
                'PAYABLE',
                (SELECT id FROM accounts WHERE code = 'PROVIDER_FEE'),
                'INSERTION',
                s.id,
                CURRENT_TIMESTAMP,
                'PROVIDER_FEE',
                'Insertion SoW #' || CAST(s.id AS VARCHAR) || ' provider fee 1/1',
                ps.party_id,
                s.duration_from,
                NULL,
                ROUND(SUM(l.unit_price * l.number_of_insertions - COALESCE(l.discount, 0))
                  * (1 - COALESCE(ps.services_fee_rate, 0)), 2),
                NULL,
                ps.sales_manager_id,
                'FORECAST',
                'insertion-' || CAST(s.id AS VARCHAR) || '-provider-' || CAST(ps.id AS VARCHAR),
                NULL
              FROM insertion_lines l
              INNER JOIN media_insertion_sows s ON s.id = l.media_insertion_sow_id
              INNER JOIN offering_media o ON o.id = l.offering_media_id
              INNER JOIN media_provider_sow_lines pl ON pl.id = o.media_provider_sow_line_id
              INNER JOIN media_provider_sows ps ON ps.id = pl.media_provider_sow_id
              WHERE s.status IN ('PENDING_APPROVAL', 'APPROVED', 'PROPOSAL', 'PENDING')
                AND ps.contract_type = 'THIRD_PARTY'
              GROUP BY s.id, s.duration_from, ps.id, ps.party_id, ps.sales_manager_id, ps.services_fee_rate
              HAVING ROUND(SUM(l.unit_price * l.number_of_insertions - COALESCE(l.discount, 0))
                * (1 - COALESCE(ps.services_fee_rate, 0)), 2) > 0
                AND NOT EXISTS (
                  SELECT 1 FROM cash_flows cf
                  WHERE cf.sow_type = 'INSERTION' AND cf.sow_id = s.id
                    AND cf.status = 'FORECAST' AND cf.reason_code = 'PROVIDER_FEE'
                    AND cf.series_id = 'insertion-' || CAST(s.id AS VARCHAR) || '-provider-' || CAST(ps.id AS VARCHAR)
                );

  - changeSet:
      id: 72
      author: porto-api
      comment: Promote insertion cash-flows to ACTUAL once the SoW leaves PENDING_APPROVAL.
      changes:
        - sql:
            sql: |
              UPDATE cash_flows
              SET status = 'ACTUAL'
              WHERE sow_type = 'INSERTION'
                AND status = 'FORECAST'
                AND sow_id IN (
                  SELECT id FROM media_insertion_sows
                  WHERE status IN ('APPROVED', 'PROPOSAL', 'PENDING', 'ACTIVE')
                );

  - changeSet:
      id: 73
      author: porto-api
      comment: >
        Cash-flow settle: fine_value on cash_flows; late_payment_fine_rate on
        insertion and provider SoWs (default 2%); ADMIN cash-flow:settle.
      changes:
        - addColumn:
            tableName: cash_flows
            columns:
              - column:
                  name: fine_value
                  type: DECIMAL(19,4)
                  remarks: Late-payment fine applied at settle (currency units)
        - addColumn:
            tableName: media_insertion_sows
            columns:
              - column:
                  name: late_payment_fine_rate
                  type: DECIMAL(19,6)
                  defaultValueNumeric: 0.02
                  constraints:
                    nullable: false
                  remarks: Fraction of original_value charged when settle is after due_date (0.02 = 2%)
        - addColumn:
            tableName: media_provider_sows
            columns:
              - column:
                  name: late_payment_fine_rate
                  type: DECIMAL(19,6)
                  defaultValueNumeric: 0.02
                  constraints:
                    nullable: false
                  remarks: Fraction of original_value charged when settle is after due_date (0.02 = 2%)
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, 'cash-flow:settle'
              FROM roles r
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = 'cash-flow:settle'
                );

  - changeSet:
      id: 74
      author: porto-api
      comment: >
        Local IdP credentials. bcrypt hashes live on users.password_hash.
        Seeded local password for admin and adiniz is changeme.
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_hash
                  type: VARCHAR(100)
                  remarks: BCrypt hash; never store a raw password
        - sql:
            sql: |
              UPDATE users
              SET password_hash = '$2a$10$o1kQFVbBy8m7tNRmrI1xru6wtvy7RWFB7J7XnkFpv4U1t4fc0K21q'
              WHERE username IN ('admin', 'adiniz')
                AND (password_hash IS NULL OR password_hash = '');

  - changeSet:
      id: 75
      author: porto-api
      comment: >
        Local IdP bootstrap passwords expire immediately. Self-service
        POST /auth/password clears password_expires_at. Admin-set passwords
        expire so the user must change them.
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_expires_at
                  type: TIMESTAMP
                  remarks: When set in the past or now, the local password must be changed
        - sql:
            sql: |
              UPDATE users
              SET password_expires_at = CURRENT_TIMESTAMP
              WHERE username IN ('admin', 'adiniz')
                AND password_hash IS NOT NULL
                AND password_hash <> ''
                AND password_expires_at IS NULL;

  - changeSet:
      id: 76
      author: porto-api
      comment: >
        ADMIN is granted by wildcard * only. Identity.hasPermission treats
        * as all access and entity:* as every action on that entity.
      validCheckSum: 9:811bc74eb0e55e87a2b619f3f41315d6
      changes:
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, '*'
              FROM roles r
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = '*'
                );
        - sql:
            sql: |
              DELETE FROM role_permissions
              WHERE permission_code <> '*'
                AND role_id IN (SELECT id FROM roles WHERE name = 'ADMIN');

