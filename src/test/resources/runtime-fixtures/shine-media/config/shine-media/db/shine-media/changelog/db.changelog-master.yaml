  - changeSet:
      id: 66
      author: porto-api
      comment: >
        Insertion slot fulfillment lifecycle: SOLD → WAITING_FOR_PARTNER_MEDIA →
        MEDIA_INSERTED → MEDIA_APPROVED → MEDIA_DEPLOYED → MEDIA_EXECUTED.
        Existing INSERTION-held USED slots become SOLD (ACTIVE SoWs with uploaded
        media advance further). House fill stays USED.
      changes:
        - sql:
            sql: |
              UPDATE inventory_slots
              SET status = 'SOLD'
              WHERE UPPER(TRIM(held_by)) = 'INSERTION'
                AND UPPER(TRIM(status)) = 'USED';
        - sql:
            sql: |
              UPDATE inventory_slots s
              SET status = 'WAITING_FOR_PARTNER_MEDIA'
              WHERE UPPER(TRIM(s.status)) = 'SOLD'
                AND s.insertion_line_id IN (
                  SELECT il.id
                  FROM insertion_lines il
                  INNER JOIN media_insertion_sows sow ON sow.id = il.media_insertion_sow_id
                  WHERE UPPER(TRIM(sow.status)) = 'ACTIVE'
                );
        - sql:
            sql: |
              UPDATE inventory_slots s
              SET status = 'MEDIA_INSERTED'
              WHERE UPPER(TRIM(s.status)) = 'WAITING_FOR_PARTNER_MEDIA'
                AND s.insertion_line_id IN (
                  SELECT insertion_line_id FROM insertion_media_contents
                  WHERE insertion_line_id IS NOT NULL
                );
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('inventory-slot:wait-for-partner-media'),
                ('inventory-slot:approve-media'),
                ('inventory-slot:reject-media'),
                ('inventory-slot:deploy-media'),
                ('inventory-slot:execute-media')
              ) AS v(permission_code)
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                );

  - changeSet:
      id: 67
