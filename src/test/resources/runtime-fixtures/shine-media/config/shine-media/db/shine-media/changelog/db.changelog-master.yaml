  - changeSet:
      id: 55
      author: porto-api
      comment: >
        PROPOSAL templates are per media channel + country (PDF + email), matching PROVIDER SoW
        templates. Rebind country-only rows to DOOH; seed the remaining channels; require media_channel_id.
      changes:
        - sql:
            sql: |
              UPDATE media_sow_templates p
              SET media_channel_id = (SELECT ch.id FROM media_channels ch WHERE ch.name = 'DOOH'),
                  name = CASE
                    WHEN p.country_code = 'BR' THEN 'Proposta de parceria — DOOH (BR)'
                    ELSE 'Provider partnership proposal — DOOH (' || p.country_code || ')'
                  END
              WHERE p.type = 'PROPOSAL'
                AND p.media_channel_id IS NULL;
        - sql:
            sql: |
              INSERT INTO media_sow_templates (
                type, name, media_channel_id, document_template_url,
                country_code, locale, document_template_key, email_template_key, email_template_url
              )
              SELECT
                'PROPOSAL',
                CASE
                  WHEN t.country_code = 'BR' THEN 'Proposta de parceria — ' || ch.name || ' (BR)'
                  ELSE 'Provider partnership proposal — ' || ch.name || ' (' || t.country_code || ')'
                END,
                t.media_channel_id,
                CASE
                  WHEN t.country_code = 'BR' THEN 'classpath:sow-templates/provider-proposal-BR.html'
                  ELSE 'classpath:sow-templates/provider-proposal-AU.html'
                END,
                t.country_code,
                t.locale,
                CASE
                  WHEN t.country_code = 'BR' THEN 'provider-proposal-BR'
                  ELSE 'provider-proposal-AU'
                END,
                CASE
                  WHEN t.country_code = 'BR' THEN 'provider-proposal-email-BR'
                  ELSE 'provider-proposal-email-AU'
                END,
                CASE
                  WHEN t.country_code = 'BR' THEN 'classpath:sow-templates/provider-proposal-email-BR.html'
                  ELSE 'classpath:sow-templates/provider-proposal-email-AU.html'
                END
              FROM media_sow_templates t
              INNER JOIN media_channels ch ON ch.id = t.media_channel_id
              WHERE t.type = 'PROVIDER'
                AND t.media_channel_id IS NOT NULL
                AND NOT EXISTS (
                  SELECT 1 FROM media_sow_templates p
                  WHERE p.type = 'PROPOSAL'
                    AND p.media_channel_id = t.media_channel_id
                    AND p.country_code = t.country_code
                )
              ORDER BY t.id;
        - addNotNullConstraint:
            tableName: media_sow_templates
            columnName: media_channel_id
            columnDataType: INT
        - addUniqueConstraint:
            tableName: media_sow_templates
            columnNames: type, media_channel_id, country_code
            constraintName: uq_media_sow_templates_type_channel_country

  - changeSet:
      id: 56
      author: porto-api
      comment: >
        Chart of accounts for cash flow. System revenue/expense accounts for SoW
        generation; manual house-typical expenses (power, install, …). Cash flows
        require account_id; sow_type/sow_id become optional for general expenses.
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: kind
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: cash_flow_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: system
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: house_typical
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createIndex:
            tableName: accounts
            indexName: idx_accounts_kind
            columns:
              - column:
                  name: kind
        - sql:
            sql: |
              INSERT INTO accounts (code, name, kind, cash_flow_type, system, house_typical) VALUES
                ('INSERTION_REVENUE', 'Insertion revenue', 'REVENUE', 'RECEIVABLE', TRUE, FALSE),
                ('CREATIVE_REVENUE', 'Creative services revenue', 'REVENUE', 'RECEIVABLE', TRUE, FALSE),
                ('GENERAL_REVENUE', 'General revenue', 'REVENUE', 'RECEIVABLE', FALSE, FALSE),
                ('PROVIDER_FEE', 'Provider fee', 'EXPENSE', 'PAYABLE', TRUE, FALSE),
                ('SALES_COMMISSION', 'Sales commission', 'EXPENSE', 'PAYABLE', TRUE, FALSE),
                ('CREATIVE_SUPPLIER_COST', 'Creative supplier cost', 'EXPENSE', 'PAYABLE', TRUE, FALSE),
                ('POWER_SUPPLY', 'Power supply', 'EXPENSE', 'PAYABLE', FALSE, TRUE),
                ('INSTALLATION', 'Installation', 'EXPENSE', 'PAYABLE', FALSE, TRUE),
                ('MAINTENANCE', 'Maintenance', 'EXPENSE', 'PAYABLE', FALSE, TRUE),
                ('SITE_RENT', 'Site rent', 'EXPENSE', 'PAYABLE', FALSE, TRUE),
                ('GENERAL_EXPENSE', 'General expense', 'EXPENSE', 'PAYABLE', FALSE, FALSE);
        - addColumn:
            tableName: cash_flows
            columns:
              - column:
                  name: account_id
                  type: INT
                  afterColumn: type
        - sql:
            sql: |
              UPDATE cash_flows
              SET account_id = (
                SELECT a.id FROM accounts a
                WHERE a.code = CASE reason_code
                  WHEN 'INSERTION_INSTALLMENT' THEN 'INSERTION_REVENUE'
                  WHEN 'CREATIVE_SERVICES_FEE' THEN 'CREATIVE_REVENUE'
                  WHEN 'PROVIDER_FEE' THEN 'PROVIDER_FEE'
                  WHEN 'SALES_COMMISSION' THEN 'SALES_COMMISSION'
                  WHEN 'CREATIVE_SUPPLIER_COST' THEN 'CREATIVE_SUPPLIER_COST'
                  ELSE CASE type
                    WHEN 'RECEIVABLE' THEN 'GENERAL_REVENUE'
                    ELSE 'GENERAL_EXPENSE'
                  END
                END
              )
              WHERE account_id IS NULL;
        - addNotNullConstraint:
            tableName: cash_flows
            columnName: account_id
            columnDataType: INT
        - addForeignKeyConstraint:
            constraintName: fk_cash_flows_account
            baseTableName: cash_flows
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
        - createIndex:
            tableName: cash_flows
            indexName: idx_cash_flows_account_id
            columns:
              - column:
                  name: account_id
        - dropNotNullConstraint:
            tableName: cash_flows
            columnName: sow_type
            columnDataType: VARCHAR(32)
        - dropNotNullConstraint:
            tableName: cash_flows
            columnName: sow_id
            columnDataType: INT
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('account:create'),
                ('account:delete'),
                ('account:list'),
                ('account:read'),
                ('account:search'),
                ('account:update')
              ) AS v(permission_code)
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                );

  - changeSet:
      id: 57
      author: porto-api
      comment: >
        Cash-flow forecast vs actual, optional series grouping, configurable
        recurrence (weekly / fortnightly / monthly / quarterly / annually).
        Seed Cloud Computing account and a 12-month AWS forecast.
      changes:
        - addColumn:
            tableName: cash_flows
            columns:
              - column:
                  name: status
                  type: VARCHAR(16)
                  afterColumn: user_id
              - column:
                  name: series_id
                  type: VARCHAR(64)
                  afterColumn: status
              - column:
                  name: recurrence
                  type: VARCHAR(16)
                  afterColumn: series_id
        - sql:
            sql: |
              UPDATE cash_flows SET status = 'ACTUAL' WHERE status IS NULL;
        - addNotNullConstraint:
            tableName: cash_flows
            columnName: status
            columnDataType: VARCHAR(16)
        - createIndex:
            tableName: cash_flows
            indexName: idx_cash_flows_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: cash_flows
            indexName: idx_cash_flows_series_id
            columns:
              - column:
                  name: series_id
        - sql:
            sql: |
              INSERT INTO accounts (code, name, kind, cash_flow_type, system, house_typical)
              SELECT 'CLOUD_COMPUTING', 'Cloud computing infrastructure', 'EXPENSE', 'PAYABLE', FALSE, FALSE
              WHERE NOT EXISTS (SELECT 1 FROM accounts WHERE code = 'CLOUD_COMPUTING');
        - sql:
            sql: |
              INSERT INTO cash_flows (
                type, account_id, sow_type, sow_id, creation_date, reason_code,
                transaction_description, party_id, due_date, original_value,
                status, series_id, recurrence
              )
              SELECT
                'PAYABLE', a.id, NULL, NULL, TIMESTAMP '2026-09-06 00:00:00', 'FORECAST',
                'AWS cloud computing — monthly forecast', NULL, d.due_date, 1200.0000,
                'FORECAST', 'seed-aws-cloud-2026', 'MONTHLY'
              FROM accounts a
              CROSS JOIN (
                SELECT DATE '2026-10-01' AS due_date UNION ALL
                SELECT DATE '2026-11-01' UNION ALL
                SELECT DATE '2026-12-01' UNION ALL
                SELECT DATE '2027-01-01' UNION ALL
                SELECT DATE '2027-02-01' UNION ALL
                SELECT DATE '2027-03-01' UNION ALL
                SELECT DATE '2027-04-01' UNION ALL
                SELECT DATE '2027-05-01' UNION ALL
                SELECT DATE '2027-06-01' UNION ALL
                SELECT DATE '2027-07-01' UNION ALL
                SELECT DATE '2027-08-01' UNION ALL
                SELECT DATE '2027-09-01'
              ) d
              WHERE a.code = 'CLOUD_COMPUTING'
                AND NOT EXISTS (
                  SELECT 1 FROM cash_flows cf WHERE cf.series_id = 'seed-aws-cloud-2026'
                );
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, 'cash-flow:forecast'
              FROM roles r
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = 'cash-flow:forecast'
                );


  - changeSet:
      id: 58
      author: porto-api
      comment: >
        Insertion SoW catalog templates (legal INSERTION + INSERTION_PROPOSAL) per
        media channel and country, mirroring PROVIDER / PROPOSAL factory HTML keys
        (insertion-AU/BR, insertion-proposal-AU/BR, insertion-proposal-email-AU/BR).
      changes:
        - sql:
            sql: |
              INSERT INTO media_sow_templates (
                type, name, media_channel_id, document_template_url,
                country_code, locale, document_template_key
              )
              SELECT
                'INSERTION',
                CASE
                  WHEN t.country_code = 'BR' THEN 'SoW de inserção — ' || ch.name || ' (BR)'
                  ELSE 'Insertion SoW — ' || ch.name || ' (' || t.country_code || ')'
                END,
                t.media_channel_id,
                CASE
                  WHEN t.country_code = 'BR' THEN 'classpath:sow-templates/insertion-BR.html'
                  ELSE 'classpath:sow-templates/insertion-AU.html'
                END,
                t.country_code,
                t.locale,
                CASE
                  WHEN t.country_code = 'BR' THEN 'insertion-BR'
                  ELSE 'insertion-AU'
                END
              FROM media_sow_templates t
              INNER JOIN media_channels ch ON ch.id = t.media_channel_id
              WHERE t.type = 'PROVIDER'
                AND t.media_channel_id IS NOT NULL
                AND NOT EXISTS (
                  SELECT 1 FROM media_sow_templates i
                  WHERE i.type = 'INSERTION'
                    AND i.media_channel_id = t.media_channel_id
                    AND i.country_code = t.country_code
                )
              ORDER BY t.id;
        - sql:
            sql: |
              INSERT INTO media_sow_templates (
                type, name, media_channel_id, document_template_url,
                country_code, locale, document_template_key, email_template_key, email_template_url
              )
              SELECT
                'INSERTION_PROPOSAL',
                CASE
                  WHEN t.country_code = 'BR' THEN 'Proposta de inserção — ' || ch.name || ' (BR)'
                  ELSE 'Insertion proposal — ' || ch.name || ' (' || t.country_code || ')'
                END,
                t.media_channel_id,
                CASE
                  WHEN t.country_code = 'BR' THEN 'classpath:sow-templates/insertion-proposal-BR.html'
                  ELSE 'classpath:sow-templates/insertion-proposal-AU.html'
                END,
                t.country_code,
                t.locale,
                CASE
                  WHEN t.country_code = 'BR' THEN 'insertion-proposal-BR'
                  ELSE 'insertion-proposal-AU'
                END,
                CASE
                  WHEN t.country_code = 'BR' THEN 'insertion-proposal-email-BR'
                  ELSE 'insertion-proposal-email-AU'
                END,
                CASE
                  WHEN t.country_code = 'BR' THEN 'classpath:sow-templates/insertion-proposal-email-BR.html'
                  ELSE 'classpath:sow-templates/insertion-proposal-email-AU.html'
                END
              FROM media_sow_templates t
              INNER JOIN media_channels ch ON ch.id = t.media_channel_id
              WHERE t.type = 'PROVIDER'
                AND t.media_channel_id IS NOT NULL
                AND NOT EXISTS (
                  SELECT 1 FROM media_sow_templates p
                  WHERE p.type = 'INSERTION_PROPOSAL'
                    AND p.media_channel_id = t.media_channel_id
                    AND p.country_code = t.country_code
                )
              ORDER BY t.id;

  - changeSet:
      id: 59
      author: porto-api
      comment: >
        Point media_sow_templates factory URLs at PORTO_API_HOME config
        (config/shine-media/templates/*.html) instead of classpath:sow-templates/.
      changes:
        - sql:
            sql: |
              UPDATE media_sow_templates
              SET document_template_url = REPLACE(
                document_template_url,
                'classpath:sow-templates/',
                'config/shine-media/templates/'
              )
              WHERE document_template_url LIKE 'classpath:sow-templates/%';
        - sql:
