      comment: ADMIN permission to run a persisted schedule immediately.
      changes:
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, 'scheduled-job:run'
              FROM roles r
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
