  - changeSet:
      id: 14
      author: porto-api
      # Seed text rewritten to Portuguese after first apply; accept prior checksum.
      validCheckSum: ANY
      changes:
        - sql:
            sql: |
              INSERT INTO cities (name, state, country)
              SELECT 'São Paulo', 'SP', 'BR'
              WHERE NOT EXISTS (
                SELECT 1 FROM cities WHERE name = 'São Paulo' AND state = 'SP' AND country = 'BR'
              )
        - sql:
            sql: |
              INSERT INTO cities (name, state, country)
              SELECT 'Curitiba', 'PR', 'BR'
              WHERE NOT EXISTS (
                SELECT 1 FROM cities WHERE name = 'Curitiba' AND state = 'PR' AND country = 'BR'
              )
        - sql:
            sql: |
              INSERT INTO cities (name, state, country)
              SELECT 'Ponta Grossa', 'PR', 'BR'
              WHERE NOT EXISTS (
                SELECT 1 FROM cities WHERE name = 'Ponta Grossa' AND state = 'PR' AND country = 'BR'
              )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Prefeitura de São Paulo — publicidade exterior (OOH estático / painéis de grande formato).
              
              Base legal: Lei Municipal nº 14.223/2006 (“Cidade Limpa”), decretos municipais e orientações da Comissão de Proteção à Paisagem Urbana (CPPU / SMUL). Fiscalização pelas Subprefeituras.
              
              Regra central: a publicidade de terceiros na paisagem urbana é amplamente proibida. Em regra, não se admite outdoors clássicos e usos típicos de mídia exterior, como:
              - anúncios em vias, parques, praças, postes, torres, viadutos, túneis e estruturas de sinalização de trânsito;
              - empenas cegas e topos de edifícios usados como face publicitária;
              - publicidade na maioria dos veículos (carros, ônibus, motos, bicicletas, carretas), com exceções limitadas (ex.: veículos de carga, conforme a lei).
              
              O que ainda pode operar (sempre confirmar orientação atual da CPPU/Subprefeitura):
              - anúncios indicativos / identificação do estabelecimento no próprio imóvel, observados limites de fachada e tipologias;
              - publicidade em mobiliário urbano concedido (ex.: abrigos de ônibus, relógios de rua), apenas sob contrato de concessão pública e regras de dimensão municipais;
              - demais formatos somente quando expressamente autorizados.
              
              Nota operacional: São Paulo é mercado altamente restritivo para outdoors/empenas estáticas de terceiros. Antes de veicular, confirme se a face é mobiliário concedido ou outra tipologia expressamente permitida.',
                     DATE '2007-01-01',
                     'https://prefeitura.sp.gov.br/web/licenciamento/w/desenvolvimento_urbano/participacao_social/conselhos_e_orgaos_colegiados/cppu/169850'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'OOH (Static)'
              WHERE c.name = 'São Paulo' AND c.country = 'BR'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Prefeitura de São Paulo — mídia exterior digital (DOOH) / painéis eletrônicos.
              
              Base legal: Lei Municipal nº 14.223/2006 (Cidade Limpa); resoluções da CPPU sobre painéis eletrônicos (ex.: Resolução SMUL.AOC.CPPU/002/2018 e orientações posteriores). Painéis digitais de grande formato voltados à via pública, em regra, são incompatíveis com a vedação de publicidade exterior da Cidade Limpa.
              
              Painéis eletrônicos em espaços internos de edificações, porém visíveis do logradouro (orientação CPPU — verificar texto vigente):
              - afastamento mínimo atrás da abertura / vedação transparente (lógica da Cidade Limpa);
              - limites de área e altura que escalam com o afastamento da abertura;
              - conteúdo prioritariamente de produtos/serviços do próprio comércio do local e conteúdos artísticos, culturais, decorativos ou informativos sem caráter publicitário de terceiros;
              - transição suave entre conteúdos; luminância sem ofuscamento a moradores, pedestres ou motoristas;
              - descumprimento: sanções da Cidade Limpa (multa e remoção) podem atingir proprietário do painel, lojista e anunciante.
              
              DOOH em mobiliário urbano: faces digitais em abrigos/relógios concedidos seguem a concessão e regras municipais de dimensão, não inventário privado de outdoors de LED.
              
              Nota operacional: tratar DOOH em São Paulo como altamente restrito — privilegiar mobiliário concedido ou telas internas visíveis do logradouro sob CPPU; não assumir inventário de LED de beira de estrada como bookável.',
                     DATE '2018-01-01',
                     'https://gestaourbana.prefeitura.sp.gov.br/noticias/cppu-regulamenta-insercao-de-paineis-eletronicos-em-espacos-internos-das-edificacoes-e-visiveis-de-logradouro-publico/'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'DOOH'
              WHERE c.name = 'São Paulo' AND c.country = 'BR'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Prefeitura Municipal de Curitiba — publicidade ao ar livre (OOH estático / anúncios).
              
              Base legal: Lei Municipal nº 8.471/1994; Decreto Municipal nº 976/2024; licenciamento por Alvará de Publicidade (Secretaria Municipal de Urbanismo) via Portal de Serviços (processo eletrônico).
              
              Conceitos (Lei 8.471):
              - Letreiro: identificação no próprio local da atividade (nome, marca/logotipo, atividade principal, endereço/telefone);
              - Anúncio: referência a produtos, serviços ou atividades em local estranho ao exercício da atividade (placas, cartazes, painéis etc.);
              - Publicidade visível ao público, em regra, depende de licença precária (alvará) da SMU.
              
              Destaques do Decreto 976/2024 para anúncios estáticos:
              - classes de dimensão para painéis com estrutura própria no solo (tipos A/B/C, faixas de área até cerca de 32 m²);
              - área máxima relacionada à testada do lote (regra da testada × 1,60 m);
              - classes de tecnologia incluem estático iluminado / não iluminado (LED tratado à parte — ver regulamento DOOH);
              - a Lei 8.471 historicamente veda distribuição manual de volantes/folhetos e a maior parte da publicidade móvel (exceto letreiros) — confirmar regra vigente antes de ações de rua.
              
              Nota operacional: veicular OOH estático em Curitiba somente com Alvará de Publicidade válido para o anúncio específico; protocolar pelo Portal de Serviços e verificar classe de área/testada no Decreto 976.',
                     DATE '2024-07-01',
                     'https://www.curitiba.pr.gov.br/servicos/alvara-publicidade/181'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'OOH (Static)'
              WHERE c.name = 'Curitiba' AND c.country = 'BR'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Prefeitura Municipal de Curitiba — mídia exterior digital (DOOH) / painéis de LED ou tecnologia similar.
              
              Base legal: Lei Municipal nº 8.471/1994; Decreto Municipal nº 976/2024 (classe tecnológica “LED ou tecnologia similar” e critérios do art. 45); Distrito de Mídia da Rua Marechal Deodoro (Decreto nº 1.871/2024) para formatos luminosos/inovadores naquele distrito; Alvará de Publicidade via Portal de Serviços.
              
              Critérios do Decreto 976 para LED / similar (resumo):
              - controle de intensidade luminosa para não gerar incômodo a pedestres e ao trânsito, independentemente da direção do painel;
              - proibidos efeitos estroboscópicos ou equivalentes que perturbem o trânsito;
              - permanecem classificações de tipo/área e regras de testada quando aplicáveis;
              - exigido alvará prévio; a análise da SMU segue os critérios técnicos do Decreto 976.
              
              Distrito de Mídia (Marechal Deodoro): regime especial para publicidade de grandes proporções e inovação tecnológica (empenas/topo etc. sob critérios do distrito), ainda sujeito a Alvará de Publicidade e às vedações da Lei 8.471 que permaneçam vigentes.
              
              Nota operacional: Curitiba admite DOOH/LED regulado (diferente da restrição ampla de São Paulo). Confirmar o local, obter alvará, configurar controle de luminância e verificar se a face está no Distrito de Mídia da Marechal Deodoro.',
                     DATE '2024-07-01',
                     'https://www.curitiba.pr.gov.br/servicos/alvara-publicidade/181'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'DOOH'
              WHERE c.name = 'Curitiba' AND c.country = 'BR'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Prefeitura Municipal de Ponta Grossa — publicidade exterior (OOH estático / anúncios).
              
              Base legal: normas municipais de edificações/publicidade (linha do Código de Obras, inclusive Lei Ordinária nº 9.875/2009; historicamente Lei nº 6.327/1999). O Projeto de Lei 474/2025 (Mensagem 132/2025), sobre marco regulatório de mídias exteriores (outdoors, LED, empenas cegas, publicidade em logradouro), tramitava na Câmara em 2025–2026 — confirmar se foi sancionado antes de se apoiar no texto do projeto.
              
              Marco operacional atual (resumo Código de Obras / Lei 9.875):
              - “anúncio” abrange publicidade visível dos logradouros: placas, tabuletas, murais, letreiros, logomarcas, adesivos etc.;
              - regras típicas de área máxima (fórmula frente à edificação/testada), avanço máximo em relação ao alinhamento predial (cerca de 1,20 m), altura mínima sobre o passeio quando houver saliência (cerca de 3 m) e restrições a obstrução de aberturas/marquises;
              - placas móveis no passeio são restringidas; braços/saliências luminosas devem respeitar os mesmos limites de avanço.
              
              PL 474/2025 (monitorar): pretende modernizar o marco para LED, empenas cegas, publicidade temporária de obra e formatos em espaço público, com taxas de licenciamento — tratar como proposta até publicação como lei.
              
              Nota operacional: para OOH estático em Ponta Grossa, licenciar sob as regras vigentes do Código de Obras/publicidade e acompanhar o PL 474/2025; obter alvará/autorização municipal antes da instalação.',
                     DATE '2009-03-30',
                     'http://www.legislador.com.br/LegisladorWEB.ASP?WCI=LeiTexto&ID=9&inEspecieLei=1&nrLei=9875&aaLei=2009'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'OOH (Static)'
              WHERE c.name = 'Ponta Grossa' AND c.country = 'BR'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Prefeitura Municipal de Ponta Grossa — mídia exterior digital (DOOH) / painéis eletrônicos de LED.
              
              Base legal: as normas mais antigas de anúncios do Código de Obras / publicidade (linha da Lei 6.327/1999 e atualizações como a Lei 9.875/2009) antecedem os painéis eletrônicos de grande porte. O Projeto de Lei 474/2025 (Mensagem 132/2025) busca regulamentar expressamente painéis de LED, empenas cegas e novas tipologias, taxas e mídia em logradouro público — ainda sujeito a debate/emendas na Câmara conforme relatos de 2025–2026.
              
              Postura prática até vigência de lei nova:
              - não presumir que outdoors de LED são livremente permitidos; obter orientação escrita do órgão municipal competente (Urbanismo ou equivalente) antes da veiculação;
              - aplicar, por analogia, regras vigentes de área, avanço, altura e segurança de anúncios quando exigido pela fiscalização;
              - esperar regras futuras específicas para LED (classes, taxas e eventual cessão de espaço para conteúdo institucional — ponto controverso junto a entidades empresariais locais).
              
              Nota operacional: inventário DOOH em Ponta Grossa exige liberação caso a caso; registrar o status do PL 474/2025 em cada booking e manter alvará/evidências em arquivo.',
                     DATE '2025-12-10',
                     'https://arede.info/ponta-grossa/625808/camara-realiza-audiencia-publica-para-debater-projeto-sobre-outdoors-em-ponta-grossa'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'DOOH'
              WHERE c.name = 'Ponta Grossa' AND c.country = 'BR'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
