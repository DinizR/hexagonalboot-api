                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: media_provider_sow_line_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: position_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
