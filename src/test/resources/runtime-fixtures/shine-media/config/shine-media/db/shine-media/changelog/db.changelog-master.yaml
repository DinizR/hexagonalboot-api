  - changeSet:
      id: 30
      author: porto-api
      comment: Materialized day-by-day inventory slots (AVAILABLE/USED/CANCELLED)
      changes:
        - createTable:
            tableName: inventory_slots
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: offering_media_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: media_vehicle_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: media_provider_sow_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: media_provider_sow_line_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: slot_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: slot_index
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: "AVAILABLE"
                  constraints:
                    nullable: false
              - column:
                  name: insertion_line_id
                  type: INT
              - column:
                  name: house_fill_id
                  type: INT
              - column:
                  name: held_by
                  type: VARCHAR(32)
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: inventory_slots
            columnNames: offering_media_id, slot_date, slot_index
            constraintName: uq_inventory_slots_offering_date_index
        - addForeignKeyConstraint:
            baseTableName: inventory_slots
            baseColumnNames: offering_media_id
            referencedTableName: offering_media
            referencedColumnNames: id
            constraintName: fk_inventory_slots_offering_media
        - addForeignKeyConstraint:
            baseTableName: inventory_slots
            baseColumnNames: media_vehicle_id
            referencedTableName: media_vehicles
            referencedColumnNames: id
            constraintName: fk_inventory_slots_media_vehicle
        - addForeignKeyConstraint:
            baseTableName: inventory_slots
            baseColumnNames: media_provider_sow_id
            referencedTableName: media_provider_sows
            referencedColumnNames: id
            constraintName: fk_inventory_slots_provider_sow
        - addForeignKeyConstraint:
            baseTableName: inventory_slots
            baseColumnNames: media_provider_sow_line_id
            referencedTableName: media_provider_sow_lines
            referencedColumnNames: id
            constraintName: fk_inventory_slots_provider_sow_line
        - addForeignKeyConstraint:
            baseTableName: inventory_slots
            baseColumnNames: insertion_line_id
            referencedTableName: insertion_lines
            referencedColumnNames: id
            constraintName: fk_inventory_slots_insertion_line
        - addForeignKeyConstraint:
            baseTableName: inventory_slots
            baseColumnNames: house_fill_id
            referencedTableName: house_fills
            referencedColumnNames: id
            constraintName: fk_inventory_slots_house_fill
        - createIndex:
            tableName: inventory_slots
            indexName: idx_inventory_slots_offering_date_status
            columns:
              - column:
                  name: offering_media_id
              - column:
                  name: slot_date
              - column:
                  name: status
        - createIndex:
            tableName: inventory_slots
            indexName: idx_inventory_slots_insertion_line_id
            columns:
              - column:
                  name: insertion_line_id
        - createIndex:
            tableName: inventory_slots
            indexName: idx_inventory_slots_house_fill_id
            columns:
              - column:
                  name: house_fill_id
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('inventory-slot:list'),
                ('inventory-slot:search'),
                ('inventory-slot:read'),
                ('inventory-slot:create'),
                ('inventory-slot:update'),
                ('inventory-slot:delete'),
                ('inventory-slot:list-for-offering'),
                ('inventory-slot:summary'),
                ('inventory-slot:generate')
              ) AS v(permission_code)
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                )

  - changeSet:
      id: 31
      author: porto-api
      comment: Seed inventory_slots from ACTIVE/PENDING provider SoW offerings (day x capacity)
      changes:
        - sql:
            sql: |
              INSERT INTO inventory_slots (
                offering_media_id, media_vehicle_id, media_provider_sow_id, media_provider_sow_line_id,
                slot_date, slot_index, status, insertion_line_id, house_fill_id, held_by, updated_at
              )
              SELECT
                om.id,
                mv.id,
                sow.id,
                psl.id,
                DATEADD('DAY', day_offset.X - 1, sow.duration_from),
                slot_idx.X,
                'AVAILABLE',
                NULL,
                NULL,
                NULL,
                CURRENT_TIMESTAMP
              FROM offering_media om
              INNER JOIN media_provider_sow_lines psl ON psl.id = om.media_provider_sow_line_id
              INNER JOIN media_provider_sows sow ON sow.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              CROSS JOIN SYSTEM_RANGE(1, 800) day_offset
              CROSS JOIN SYSTEM_RANGE(1, 100) slot_idx
              WHERE UPPER(TRIM(sow.status)) IN ('ACTIVE', 'PENDING')
                AND sow.duration_from IS NOT NULL
                AND sow.duration_to IS NOT NULL
                AND mv.capacity_quantity IS NOT NULL
                AND mv.capacity_quantity > 0
                AND slot_idx.X <= mv.capacity_quantity
                AND DATEADD('DAY', day_offset.X - 1, sow.duration_from) <= sow.duration_to
                AND NOT EXISTS (
                  SELECT 1 FROM inventory_slots s
                  WHERE s.offering_media_id = om.id
                    AND s.slot_date = DATEADD('DAY', day_offset.X - 1, sow.duration_from)
                    AND s.slot_index = slot_idx.X
                );
        - sql:
            sql: |
              MERGE INTO inventory_slots target
              USING (
                SELECT slot_id, hf_id FROM (
                  SELECT s.id AS slot_id,
                         hf.id AS hf_id,
                         hf.slot_quantity AS qty,
                         ROW_NUMBER() OVER (
                           PARTITION BY hf.id
                           ORDER BY s.slot_date, s.slot_index
                         ) AS rn
                  FROM house_fills hf
                  INNER JOIN inventory_slots s
                    ON s.offering_media_id = hf.offering_media_id
                   AND UPPER(TRIM(s.status)) = 'AVAILABLE'
                   AND s.slot_date >= hf.effective_from
                   AND (hf.effective_to IS NULL OR s.slot_date <= hf.effective_to)
                  WHERE UPPER(TRIM(hf.status)) = 'ACTIVE'
                    AND NOT EXISTS (
                      SELECT 1 FROM inventory_slots held
                      WHERE held.house_fill_id = hf.id
                        AND UPPER(TRIM(held.status)) = 'USED'
                    )
                ) ranked
                WHERE ranked.rn <= ranked.qty
              ) src
              ON target.id = src.slot_id
              WHEN MATCHED THEN UPDATE SET
                status = 'USED',
                house_fill_id = src.hf_id,
                held_by = 'HOUSE_FILL',
                insertion_line_id = NULL,
                updated_at = CURRENT_TIMESTAMP;
        - sql:
            sql: |
              MERGE INTO inventory_slots target
              USING (
                SELECT slot_id, line_id FROM (
                  SELECT s.id AS slot_id,
                         il.id AS line_id,
                         il.number_of_insertions AS qty,
                         ROW_NUMBER() OVER (
                           PARTITION BY il.id
                           ORDER BY s.slot_date, s.slot_index
                         ) AS rn
                  FROM insertion_lines il
                  INNER JOIN media_insertion_sows isow ON isow.id = il.media_insertion_sow_id
                  INNER JOIN inventory_slots s
                    ON s.offering_media_id = il.offering_media_id
                   AND UPPER(TRIM(s.status)) = 'AVAILABLE'
                   AND s.slot_date >= isow.duration_from
                   AND s.slot_date <= isow.duration_to
                  WHERE UPPER(TRIM(isow.status)) IN ('PENDING', 'ACTIVE')
                    AND isow.duration_from IS NOT NULL
                    AND isow.duration_to IS NOT NULL
                    AND NOT EXISTS (
                      SELECT 1 FROM inventory_slots held
                      WHERE held.insertion_line_id = il.id
                        AND UPPER(TRIM(held.status)) = 'USED'
                    )
                ) ranked
                WHERE ranked.rn <= ranked.qty
              ) src
              ON target.id = src.slot_id
              WHEN MATCHED THEN UPDATE SET
                status = 'USED',
                insertion_line_id = src.line_id,
                held_by = 'INSERTION',
                house_fill_id = NULL,
                updated_at = CURRENT_TIMESTAMP;

  - changeSet:
      id: 32
      author: porto-api
      comment: Provider line positions (pages/breaks/rolls) + inventory_slots.position_code; print seed
      changes:
        - createTable:
