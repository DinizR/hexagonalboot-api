                AND psl.slot_monthly_price IS NOT NULL
                AND EXISTS (
                  SELECT 1
                  FROM media_vehicles mv
                  INNER JOIN media_channels ch ON ch.id = mv.media_channel_id
                  WHERE mv.id = psl.media_vehicle_id
                    AND ch.name = 'DOOH'
