        - sql:
            sql: |
              UPDATE offering_media o
              SET daily_audience = (
                SELECT psl.exposure FROM media_provider_sow_lines psl
                WHERE psl.id = o.media_provider_sow_line_id
              )
              WHERE o.daily_audience IS NULL
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  WHERE psl.id = o.media_provider_sow_line_id AND psl.exposure IS NOT NULL
                );
        - sql:
            sql: |
              UPDATE offering_media o
              SET print_run = 45000, subscriber_count = 120000
              WHERE o.name = 'Gazeta do Povo Curitiba — weekend magazine — inventory'
                AND o.print_run IS NULL;
        - sql:
            sql: |
              INSERT INTO parties (name, type, address, tax_number_id, business_area_id)
              SELECT 'Mundo Sem Fim', 'PROVIDER', 'São Paulo, SP, Brasil', 'CNPJ-MSF-PRO', ba.id
              FROM business_areas ba
              WHERE ba.name = 'Media Owner'
                AND NOT EXISTS (SELECT 1 FROM parties WHERE tax_number_id = 'CNPJ-MSF-PRO');
        - sql:
            sql: |
              INSERT INTO users (first_name, last_name, username, address, city, state, country, phone, email, party_id, status)
              SELECT 'Mundo', 'Sem Fim', 'mundosemfim', p.address, 'São Paulo', 'SP', 'Brazil',
                     '+55 11 90000-0006', 'contato@mundosemfim.example', p.id, 'ACTIVE'
              FROM parties p
              WHERE p.tax_number_id = 'CNPJ-MSF-PRO'
                AND NOT EXISTS (SELECT 1 FROM users u WHERE u.username = 'mundosemfim');
        - sql:
            sql: |
              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              CROSS JOIN roles r
              WHERE u.username = 'mundosemfim' AND r.name = 'PROVIDER'
                AND NOT EXISTS (
                  SELECT 1 FROM user_roles ur
                  WHERE ur.user_id = u.id AND ur.role_id = r.id
                );
        - sql:
            sql: |
              INSERT INTO media_sow_templates (type, name, media_channel_id, document_template_url, country_code, locale, document_template_key)
              SELECT 'PROVIDER', 'Provider SoW — OLV (BR)', ch.id,
                     'classpath:sow-templates/provider-BR.html', 'BR', 'pt-BR', 'provider-BR'
              FROM media_channels ch
              WHERE ch.name = 'Online Video (OLV)'
                AND NOT EXISTS (
                  SELECT 1 FROM media_sow_templates t
                  WHERE t.type = 'PROVIDER' AND t.name = 'Provider SoW — OLV (BR)'
                );
        - sql:
            sql: |
              INSERT INTO media_vehicles (
                media_channel_id, location_id, name, schedule_type, capacity_type,
                capacity_quantity, duration_hint, air_time, recurrence
              )
              SELECT ch.id, NULL, 'Mundo sem fim — YouTube channel',
                     'ASSET', 'PER_ASSET', 3, '30 min video', NULL, 'WEEKLY'
              FROM media_channels ch
              WHERE ch.name = 'Online Video (OLV)'
                AND NOT EXISTS (
                  SELECT 1 FROM media_vehicles mv WHERE mv.name = 'Mundo sem fim — YouTube channel'
                );
        - sql:
            sql: |
              INSERT INTO media_provider_sows (
                creation_date, party_id, duration_from, duration_to, template_id, currency,
                services_fee_rate, signed_by_user_id, signature_reference, signed_sow_url,
                sales_manager_id, status, contract_type, payment_day_of_month
              )
              SELECT TIMESTAMP '2026-08-14 12:00:00',
                     p.id,
                     DATE '2026-08-01',
                     DATE '2027-07-31',
                     t.id,
                     'BRL',
                     0.10,
                     signer.id,
                     'esign-provider-msf-olv-001',
                     'https://sows.shinemedia.local/provider/esign-provider-msf-olv-001.pdf',
                     sm.id,
                     'ACTIVE',
                     'THIRD_PARTY',
                     5
              FROM parties p
              INNER JOIN media_sow_templates t ON t.name = 'Provider SoW — OLV (BR)' AND t.type = 'PROVIDER'
              INNER JOIN users signer ON signer.username = 'mundosemfim'
              INNER JOIN users sm ON sm.username = 'adiniz'
              WHERE p.tax_number_id = 'CNPJ-MSF-PRO'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sows s
                  WHERE s.signature_reference = 'esign-provider-msf-olv-001'
                );
        - sql:
            sql: |
              INSERT INTO media_provider_sow_lines (
                media_provider_sow_id, media_channel_id, location_id, slot_duration_minutes,
                media_vehicle_id, number_of_insertions, exposure, slot_monthly_price, monthly_price
              )
              SELECT s.id, ch.id, NULL, 1, mv.id, 3, NULL, 8000.00, 24000.00
              FROM media_provider_sows s
              INNER JOIN media_channels ch ON ch.name = 'Online Video (OLV)'
              INNER JOIN media_vehicles mv ON mv.name = 'Mundo sem fim — YouTube channel'
              WHERE s.signature_reference = 'esign-provider-msf-olv-001'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sow_lines l
                  WHERE l.media_provider_sow_id = s.id AND l.media_vehicle_id = mv.id
                );
        - sql:
            sql: |
              INSERT INTO offering_media (
                name, media_provider_sow_line_id, tax_rate,
                daily_audience, print_run, subscriber_count, view_count
              )
              SELECT 'Mundo sem fim — YouTube mid-rolls', psl.id, 0.05,
