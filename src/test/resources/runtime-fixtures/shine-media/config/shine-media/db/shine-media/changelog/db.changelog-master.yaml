                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                );

  - changeSet:
      id: 69
      author: porto-api
      comment: >
        Daily midnight slot-execution-alert. Parameters daysBefore=15 and
        administratorEmail=rodrigo.dinis@outlook.com. Quartz cron is 0 0 0 * * ? (JVM local midnight).
      changes:
        - sql:
            sql: |
              INSERT INTO scheduled_jobs (job_id, cron_expression, enabled, created_at, updated_at)
              SELECT 'slot-execution-alert', '0 0 0 * * ?', TRUE, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (
                SELECT 1 FROM scheduled_jobs WHERE job_id = 'slot-execution-alert'
              );
