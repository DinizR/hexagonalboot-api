  - changeSet:
      id: 25
      author: porto-api
      comment: Seed provider signer users, PROVIDER SoW template, Melbourne provider SoW line and offering media
      changes:
        - sql:
            sql: |
              INSERT INTO users (first_name, last_name, username, address, city, state, country, phone, email, party_id, status)
              SELECT v.first_name, v.last_name, v.username, p.address, v.city, v.state, v.country, v.phone, v.email, p.id, 'ACTIVE'
              FROM (
                VALUES
                  ('Morgan', 'Lee', 'mlee', 'ABN-MEL-PRO', 'Melbourne', 'VIC', 'Australia', '+61 400 000 001', 'morgan.lee@melbourne-provider.example'),
                  ('Casey', 'Nguyen', 'cnguyen', 'ABN-BNE-PRO', 'Brisbane', 'QLD', 'Australia', '+61 400 000 002', 'casey.nguyen@brisbane-provider.example'),
                  ('Ana', 'Souza', 'asouza', 'CNPJ-SP-PRO', 'São Paulo', 'SP', 'Brazil', '+55 11 90000-0003', 'ana.souza@saopaulo-provider.example'),
                  ('Bruno', 'Costa', 'bcosta', 'CNPJ-CWB-PRO', 'Curitiba', 'PR', 'Brazil', '+55 41 90000-0004', 'bruno.costa@curitiba-provider.example'),
                  ('Fernanda', 'Lima', 'flima', 'CNPJ-PG-PRO', 'Ponta Grossa', 'PR', 'Brazil', '+55 42 90000-0005', 'fernanda.lima@pg-provider.example')
              ) AS v(first_name, last_name, username, party_tax, city, state, country, phone, email)
              INNER JOIN parties p ON p.tax_number_id = v.party_tax
              WHERE NOT EXISTS (SELECT 1 FROM users u WHERE u.username = v.username)
        - sql:
            sql: |
              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              CROSS JOIN roles r
              WHERE r.name = 'PROVIDER'
                AND u.username IN ('mlee', 'cnguyen', 'asouza', 'bcosta', 'flima')
                AND NOT EXISTS (
                  SELECT 1 FROM user_roles ur
                  WHERE ur.user_id = u.id AND ur.role_id = r.id
                )
        - sql:
            sql: |
              INSERT INTO media_sow_templates (type, name, media_channel_id, document_template_url)
              SELECT 'PROVIDER', 'Provider SoW — OOH Static', ch.id,
                     'https://templates.shinemedia.local/provider-ooh-static.pdf'
              FROM media_channels ch
              WHERE ch.name = 'OOH (Static)'
                AND NOT EXISTS (
                  SELECT 1 FROM media_sow_templates t
                  WHERE t.type = 'PROVIDER' AND t.name = 'Provider SoW — OOH Static'
                )
        - sql:
            sql: |
              INSERT INTO media_provider_sows (
                creation_date, party_id, duration_from, duration_to, template_id, currency,
                services_fee_rate, signed_by_user_id, signature_reference, signed_sow_url,
                sales_manager_id, status
              )
              SELECT TIMESTAMP '2026-08-10 12:03:02',
                     p.id,
                     DATE '2026-08-01',
                     DATE '2027-07-31',
                     t.id,
                     'AUD',
                     0.10,
                     signer.id,
                     'esign-provider-mel-ooh-001',
                     'https://sows.shinemedia.local/provider/melbourne-ooh-001.pdf',
                     sm.id,
                     'ACTIVE'
              FROM parties p
              INNER JOIN media_sow_templates t ON t.name = 'Provider SoW — OOH Static' AND t.type = 'PROVIDER'
              INNER JOIN users signer ON signer.username = 'mlee'
              INNER JOIN users sm ON sm.username = 'adiniz'
              WHERE p.tax_number_id = 'ABN-MEL-PRO'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sows s
                  WHERE s.signature_reference = 'esign-provider-mel-ooh-001'
                )
        - sql:
            sql: |
              INSERT INTO media_provider_sow_lines (
                media_provider_sow_id, media_channel_id, location_id, slot_duration_minutes,
                media_vehicle_id, number_of_insertions, exposure, monthly_price
              )
              SELECT s.id, ch.id, loc.id, NULL, mv.id, 1, 85000, 12500.00
              FROM media_provider_sows s
              INNER JOIN media_channels ch ON ch.name = 'OOH (Static)'
              INNER JOIN media_locations loc ON loc.name = 'Flinders St Station Billboard Face A'
              INNER JOIN media_vehicles mv ON mv.name = 'Flinders St Billboard Face A'
              WHERE s.signature_reference = 'esign-provider-mel-ooh-001'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sow_lines l
                  WHERE l.media_provider_sow_id = s.id
                    AND l.media_vehicle_id = mv.id
                )
        - sql:
            sql: |
              INSERT INTO offering_media (name, media_provider_sow_line_id, tax_rate)
              SELECT 'Flinders St Billboard Face A — Melbourne OOH inventory', l.id, 0.10
              FROM media_provider_sow_lines l
              INNER JOIN media_provider_sows s ON s.id = l.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = l.media_vehicle_id
              WHERE s.signature_reference = 'esign-provider-mel-ooh-001'
                AND mv.name = 'Flinders St Billboard Face A'
                AND NOT EXISTS (
                  SELECT 1 FROM offering_media o
                  WHERE o.name = 'Flinders St Billboard Face A — Melbourne OOH inventory'
                )

  - changeSet:
      id: 26
      author: porto-api
      comment: Add Media Owner and Creative Production business areas; reassign provider/creative parties
      changes:
        - sql:
            sql: |
              INSERT INTO business_areas (name, description)
              SELECT 'Media Owner', 'Owners and operators of media inventory (OOH, DOOH, broadcast, print, digital)'
              WHERE NOT EXISTS (SELECT 1 FROM business_areas WHERE name = 'Media Owner');

              INSERT INTO business_areas (name, description)
              SELECT 'Creative Production', 'Creative studios and content suppliers producing advertising assets'
              WHERE NOT EXISTS (SELECT 1 FROM business_areas WHERE name = 'Creative Production');
        - sql:
            sql: |
              UPDATE parties
              SET business_area_id = (SELECT id FROM business_areas WHERE name = 'Media Owner')
              WHERE name LIKE '%Media Provider%'
                AND business_area_id <> (SELECT id FROM business_areas WHERE name = 'Media Owner');

              UPDATE parties
              SET business_area_id = (SELECT id FROM business_areas WHERE name = 'Creative Production')
              WHERE name LIKE '%Creative Studio%'
                AND business_area_id <> (SELECT id FROM business_areas WHERE name = 'Creative Production');

  - changeSet:
      id: 27
      author: porto-api
      comment: Add parties.type (INSERTION, PROVIDER, CREATIVE) for UI filtering
      changes:
        - addColumn:
            tableName: parties
            columns:
              - column:
                  name: type
                  type: VARCHAR(32)
                  afterColumn: name
        - sql:
            sql: |
              UPDATE parties SET type = 'INSERTION'
              WHERE type IS NULL AND (name LIKE '%Insertion Buyer%' OR name = 'Acme Ads');

              UPDATE parties SET type = 'PROVIDER'
              WHERE type IS NULL AND name LIKE '%Media Provider%';

              UPDATE parties SET type = 'CREATIVE'
              WHERE type IS NULL AND name LIKE '%Creative Studio%';

              UPDATE parties SET type = 'INSERTION'
              WHERE type IS NULL;
        - addNotNullConstraint:
            tableName: parties
            columnName: type
            columnDataType: VARCHAR(32)
        - createIndex:
            tableName: parties
            indexName: idx_parties_type
            columns:
              - column:
                  name: type

  - changeSet:
      id: 28
      author: porto-api
      comment: House fill for unsold offering slots (no Insertion SoW)
      changes:
        - createTable:
            tableName: house_fills
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: offering_media_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: media_vehicle_id
                  type: INT
              - column:
                  name: reason
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: storage_location_url
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: slot_quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: effective_to
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: INT
        - addForeignKeyConstraint:
            baseTableName: house_fills
            baseColumnNames: offering_media_id
            referencedTableName: offering_media
            referencedColumnNames: id
            constraintName: fk_house_fills_offering_media
        - addForeignKeyConstraint:
            baseTableName: house_fills
            baseColumnNames: media_vehicle_id
            referencedTableName: media_vehicles
            referencedColumnNames: id
            constraintName: fk_house_fills_media_vehicle
        - addForeignKeyConstraint:
            baseTableName: house_fills
            baseColumnNames: created_by_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_house_fills_created_by_user
        - createIndex:
            tableName: house_fills
            indexName: idx_house_fills_offering_media_id
            columns:
              - column:
                  name: offering_media_id
        - createIndex:
            tableName: house_fills
            indexName: idx_house_fills_status
            columns:
              - column:
                  name: status
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('house-fill:list'),
                ('house-fill:search'),
                ('house-fill:read'),
                ('house-fill:create'),
                ('house-fill:update'),
                ('house-fill:delete')
              ) AS v(permission_code)
              WHERE r.name = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                )
        - sql:
            sql: |
              INSERT INTO house_fills (
                offering_media_id, media_vehicle_id, reason, storage_location_url,
                slot_quantity, effective_from, effective_to, status, created_by_user_id
              )
              SELECT o.id, mv.id, 'HOUSE_AD',
                     'https://assets.shinemedia.local/house/melbourne-ooh-house-loop.mp4',
                     1, DATE '2026-08-01', DATE '2027-07-31', 'ACTIVE', u.id
              FROM offering_media o
              INNER JOIN media_provider_sow_lines l ON l.id = o.media_provider_sow_line_id
              INNER JOIN media_vehicles mv ON mv.id = l.media_vehicle_id
              INNER JOIN users u ON u.username = 'mlee'
              WHERE o.name = 'Flinders St Billboard Face A — Melbourne OOH inventory'
                AND NOT EXISTS (
                  SELECT 1 FROM house_fills hf
                  WHERE hf.offering_media_id = o.id AND hf.reason = 'HOUSE_AD'
