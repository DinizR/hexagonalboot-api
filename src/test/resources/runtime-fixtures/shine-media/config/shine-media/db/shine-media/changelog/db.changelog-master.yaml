                'config/shine-media/templates/'
              )
              WHERE email_template_url LIKE 'classpath:sow-templates/%';

  - changeSet:
      id: 60
      author: porto-api
      comment: >
        Insertion SoW proposal flow: advertiser_contact_user_id + proposal_document_url;
        Print (BR) PROVIDER/INSERTION/INSERTION_PROPOSAL catalog rows; ADMIN permissions
        for send-proposal / accept-proposal / download-proposal.
