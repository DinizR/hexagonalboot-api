  - changeSet:
      id: 63
      author: porto-api
      comment: >
        Supervisor approval before commercial proposals: SUPERVISOR role;
        ADMIN + SUPERVISOR approve-proposal permissions; backfill unsent PROPOSAL
        SoWs to PENDING_APPROVAL so send-proposal requires POST …/approve-proposal.
      changes:
        - sql:
            sql: |
              INSERT INTO roles (name)
              SELECT 'SUPERVISOR'
              WHERE NOT EXISTS (SELECT 1 FROM roles WHERE name = 'SUPERVISOR');
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('media-provider-sow:approve-proposal'),
                ('media-insertion-sow:approve-proposal')
              ) AS v(permission_code)
              WHERE r.name IN ('ADMIN', 'SUPERVISOR')
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                );
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_code)
              SELECT r.id, v.permission_code
              FROM roles r
              CROSS JOIN (
                VALUES
                ('media-provider-sow:list'),
                ('media-provider-sow:read'),
                ('media-provider-sow:search'),
                ('media-provider-sow:download-proposal'),
                ('media-insertion-sow:list'),
                ('media-insertion-sow:read'),
                ('media-insertion-sow:search'),
                ('media-insertion-sow:download-proposal')
              ) AS v(permission_code)
              WHERE r.name = 'SUPERVISOR'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_code = v.permission_code
                );
        - sql:
            sql: |
              UPDATE media_insertion_sows
              SET status = 'PENDING_APPROVAL'
              WHERE UPPER(TRIM(status)) = 'PROPOSAL'
                AND (proposal_document_url IS NULL OR TRIM(proposal_document_url) = '');
        - sql:
            sql: |
              UPDATE media_provider_sows
              SET status = 'PENDING_APPROVAL'
              WHERE UPPER(TRIM(status)) = 'PROPOSAL'
                AND UPPER(TRIM(contract_type)) = 'THIRD_PARTY'
