              SELECT j.id, 'daysBefore', '15'
              FROM scheduled_jobs j
              WHERE j.job_id = 'slot-execution-alert'
                AND NOT EXISTS (
                  SELECT 1 FROM scheduled_job_parameters p
                  WHERE p.scheduled_job_id = j.id AND p.param_key = 'daysBefore'
                );
              INSERT INTO scheduled_job_parameters (scheduled_job_id, param_key, param_value)
              SELECT j.id, 'administratorEmail', 'rodrigo.dinis@outlook.com'
              FROM scheduled_jobs j
              WHERE j.job_id = 'slot-execution-alert'
                AND NOT EXISTS (
                  SELECT 1 FROM scheduled_job_parameters p
                  WHERE p.scheduled_job_id = j.id AND p.param_key = 'administratorEmail'
                );

  - changeSet:
      id: 70
