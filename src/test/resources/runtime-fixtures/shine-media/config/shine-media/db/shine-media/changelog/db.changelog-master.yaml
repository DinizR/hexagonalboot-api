  - changeSet:
      id: 9
      author: porto-api
      changes:
        - sql:
            sql: |
              INSERT INTO cities (name, state, country)
              SELECT 'Melbourne', 'VIC', 'AU'
              WHERE NOT EXISTS (
                SELECT 1 FROM cities WHERE name = 'Melbourne' AND state = 'VIC' AND country = 'AU'
              )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'City of Melbourne — bus shelter / street-furniture advertising (OOH static panels).
              
              Authority: Melbourne Planning Scheme (City of Melbourne as Responsible Authority), principally Clause 52.05 (Signs) and local policy Clause 15.01-1L-02. Metropolitan bus shelters are also subject to Department of Transport / Transport for Victoria bus-shelter agreements for asset construction, maintenance and advertising rights.
              
              Permit triggers (City of Melbourne guidance):
              - Display or alteration of most advertising/promotion signs requires a planning permit under Clause 52.05; category of control is set by the zone (Sections 1–3).
              - In a Heritage Overlay, a planning permit is required for all signage, including changing or updating the content of an existing sign.
              - Capital City Zone (central city): limited business-identification signs may be exempt when not in a Heritage Overlay; third-party promotion panels on street furniture are not covered by those limited exemptions and generally require assessment.
              - Content of a lawfully displayed sign may be renewed or replaced, but a further permit is required if the renewal changes the sign type, size, illumination or other conditions of the existing permission (Clause 52.05).
              
              Promotion / major promotion signs:
              - Assess character, amenity and viewline impacts under Clause 52.05 decision guidelines.
              - Major promotion signs are discouraged where they would dominate residential areas, heritage places or significant viewlines; encouraged in commercial/industrial settings only where they complement local character.
              - Unless a shorter period is specified, a permit for a promotion or major promotion sign expires 15 years from the date of issue (Clause 52.05-9); on expiry the sign and dedicated support/illumination structures must be removed.
              
              Operational note for bus-stop displays: confirm land tenure (Council vs DoT-owned shelter), zone/overlay stack (especially Heritage Overlay and Capital City Zone), and whether advertising rights sit under a TfV Bus Shelter Agreement before booking creative.',
                     DATE '2023-01-01',
                     'https://www.melbourne.vic.gov.au/melbourne-planning-scheme-do-i-need-permit'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'OOH (Static)'
              WHERE c.name = 'Melbourne' AND c.state = 'VIC' AND c.country = 'AU'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
  - changeSet:
      id: 10
      author: porto-api
      changes:
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'City of Melbourne — digital out-of-home (DOOH) / electronic & illuminated outdoor screens.

              Authority: Melbourne Planning Scheme (City of Melbourne as Responsible Authority), principally Clause 52.05 (Signs) and local policy Clause 15.01-1L-02. Electronic and illuminated outdoor advertising near freeways/arterial roads is also assessed by the Head, Transport for Victoria (Department of Transport and Planning) under Clause 52.05-3 referral and DTP illuminated outdoor advertising guidelines.

              Permit triggers (City of Melbourne / Clause 52.05):
              - Electronic signs (content updated electronically), animated signs, and most illuminated promotion signs require a planning permit; zone category tables (Sections 1–3) set the control level.
              - Capital City Zone: limited exemptions exist mainly for non-animated business-identification signs; electronic/animated promotion screens are not covered by those exemptions and generally need a permit (see also Metro Signs Pty Ltd v Melbourne CC [2017] VCAT 453).
              - Heritage Overlay: a planning permit is required for all signage, including changing display content on an existing digital face.
              - Renewing creative on a lawfully displayed electronic sign may still need a further permit if the renewal alters sign type, size, illumination, dwell/transition behaviour, or other permit conditions.

              Road-safety & luminance (Head, TfV / DTP):
              - Applications for animated and/or electronic signs within 60 m of a freeway or arterial road are referred to the Head, Transport for Victoria (Clause 52.05-3).
              - Assessment typically covers location/orientation, luminance and glare (veiling luminance), interaction with traffic instruction signage, and impacts on road safety and network efficiency.
              - Expect permit conditions requiring automated ambient-light sensors (photocells), maximum average luminance / threshold-increment limits per DTP Requirements and Guidelines for Illuminated Outdoor Advertising Signage, and ability for the Responsible Authority / Head, TfV to require luminance adjustment after commissioning.
              - Image transitions should avoid flashing or high-contrast flicker; dwell times and transition methods are commonly conditioned (e.g. static dwell with controlled fade, not rapid animation toward traffic).

              Promotion / major promotion digital faces:
              - Same Clause 52.05 character, amenity and viewline tests as static OOH; major promotion signs (≥18 m²) attract stricter locational principles (discouraged where dominant from residential areas, heritage places or significant viewlines).
              - Default permit expiry for promotion / major promotion signs is 15 years from issue unless a shorter period is specified (Clause 52.05-9); on expiry the screen and dedicated support/illumination structures must be removed.

              Operational note for DOOH bookings: confirm zone/overlay stack (Heritage Overlay, Capital City Zone, road proximity <60 m), whether Head TfV referral/conditions apply, luminance profile for day/night, and content-change rules before scheduling creative rotations.',
                     DATE '2023-10-01',
                     'https://www.vic.gov.au/animated-and-electronic-signage'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'DOOH'
              WHERE c.name = 'Melbourne' AND c.state = 'VIC' AND c.country = 'AU'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
  - changeSet:
      id: 11
      author: porto-api
      changes:
        - sql:
            sql: |
              INSERT INTO cities (name, state, country)
              SELECT 'Brisbane', 'QLD', 'AU'
              WHERE NOT EXISTS (
                SELECT 1 FROM cities WHERE name = 'Brisbane' AND state = 'QLD' AND country = 'AU'
              )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Brisbane City Council — outdoor advertising devices (OOH static panels, billboards, street furniture).

              Authority: Advertising Devices Local Law 2021 (Brisbane City Council). Separately, assessable development aspects of some devices may also engage the Planning Act 2016 / Brisbane City Plan. Council online Advertising device approval process covers new devices, amendments, transfers and pre-lodgement meetings.

              Regulatory pathways:
              - Prohibited: cannot be displayed and cannot be approved (e.g. bunting/streamers, fly posters, inflatable signs, standing vehicle signs, and high-impact electronic display signs in certain heritage/character locations — see DOOH regulation for EDC rules).
              - Permitted (self-assessable): may be displayed without an application if the device type and site meet the Permitted Advertising Devices Designation (and any applicable technical standards if illuminated).
              - Approval required: all other advertising devices need Council approval before install/erect/display (Local Law s.7).

              Typical static OOH considerations under Council local law and assessment rules:
              - Third-party / off-premises content may be restricted by approval conditions.
              - Site context: character of the location, amenity, clutter, and consistency with surrounding built form; Council may amend or cancel approvals if character changes or the device significantly detracts from local character.
              - Heritage places, Commercial character building overlay and Pre-1911 building overlay attract stricter controls (especially for high-impact electronic devices; static devices still need careful overlay checks).
              - Applications generally need accurate site plans, device design/construction details, and landowner consent if the applicant is not the owner; application and annual permit fees apply per device.

              Operational note for static OOH bookings in Brisbane LGA: confirm whether the face is prohibited, self-assessable under the Permitted Advertising Devices Designation, or needs a full Advertising device approval; check overlays/heritage; and allow time for pre-lodgement if the site is sensitive.',
                     DATE '2021-07-01',
                     'https://www.brisbane.qld.gov.au/laws-and-permits/licences-permits-regulations/advertising-device-approval'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'OOH (Static)'
              WHERE c.name = 'Brisbane' AND c.state = 'QLD' AND c.country = 'AU'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
        - sql:
            sql: |
              INSERT INTO city_regulations (city_id, media_channel_id, regulations, effective_date, document_url)
              SELECT c.id,
                     ch.id,
                     'Brisbane City Council — digital out-of-home (DOOH) / illuminated and Electronic Display Component (EDC) signs.

              Authority: Advertising Devices Local Law 2021; Advertising Devices Technical Standards (illumination and/or EDC); Brisbane City Council Advertising device approval process. High-impact EDC means the electronic display component is greater than 4 m2; low-impact EDC is 4 m2 or less.

              Prohibited high-impact EDC (cannot apply for approval) — Local Law s.6(2)(b):
              - Outside the City frame: on a heritage place; within 50 m of a heritage place on the same road(s); on land in the Commercial character building overlay or Pre-1911 building overlay; or within 50 m of such a building on the same road(s).
              - Inside the City frame: on a heritage place; or on land in the Commercial character building overlay or Pre-1911 building overlay.
              - Other generally prohibited devices (bunting, fly posters, inflatables, standing vehicle signs) also apply.

              Where not prohibited:
              - Obtain Council approval unless the device is a designated permitted (self-assessable) advertising device — illuminated/EDC self-assessable devices must still meet the Technical Standards.
              - Road-facing EDC visible to drivers: no video/animated content; no split multi-ads on one EDC; must not imitate traffic control devices or instruct drivers (e.g. Stop/Halt/Give Way); avoid large red/green areas that could be mistaken for signals or vehicle lights; default to a blank (black) screen on malfunction.
              - Dwell time (changeable content visible from a roadway): minimum 8 seconds where signed speed is 80 km/h or less; higher-speed approaches may require Traffic Planning and Operations advice.
              - Image change: whole-screen change in less than 0.5 s (ideally 0.3-0.5 s); no fly-in/scroll transitions; do not go blank between creatives (except malfunction black screen).
              - Low-impact EDC: images must remain fully static (no flash/movement/video) within each dwell.
              - Illumination/luminance: comply with Technical Standards luminance levels and automated brightness adjustment (photocell/ambient control) for day/night amenity and road safety; Council may require data logging evidence of content behaviour.

              Operational note for DOOH bookings: screen location against City frame / heritage / character overlays first (high-impact EDC may be banned outright); then confirm approval vs self-assessment, dwell/transition specs, luminance profile, and road-visibility constraints before scheduling creative rotations.',
                     DATE '2021-07-01',
                     'https://www.brisbane.qld.gov.au/laws-and-permits/licences-permits-regulations/advertising-device-approval'
              FROM cities c
              INNER JOIN media_channels ch ON ch.name = 'DOOH'
              WHERE c.name = 'Brisbane' AND c.state = 'QLD' AND c.country = 'AU'
                AND NOT EXISTS (
                  SELECT 1 FROM city_regulations r
                  WHERE r.city_id = c.id AND r.media_channel_id = ch.id
                )
