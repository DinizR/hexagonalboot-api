              INNER JOIN media_provider_sows s ON s.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              WHERE s.signature_reference = 'esign-provider-msf-olv-001'
                AND mv.name = 'Mundo sem fim — YouTube channel'
                AND NOT EXISTS (
                  SELECT 1 FROM offering_media o
                  WHERE o.name = 'Mundo sem fim — YouTube mid-rolls'
                );
        - sql:
            sql: |
              INSERT INTO media_provider_sow_line_content_specs (
                media_provider_sow_line_id, media_kind, allowed_extensions,
                width_px, height_px, duration_seconds, duration_tolerance_seconds, max_bytes
              )
              SELECT psl.id, 'VIDEO', 'mp4', 1920, 1080, 30, 0, CAST(52428800 AS BIGINT)
              FROM media_provider_sow_lines psl
              INNER JOIN media_provider_sows s ON s.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              WHERE s.signature_reference = 'esign-provider-msf-olv-001'
                AND mv.name = 'Mundo sem fim — YouTube channel'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sow_line_content_specs spec
                  WHERE spec.media_provider_sow_line_id = psl.id
                );
        - sql:
            sql: |
              INSERT INTO inventory_slots (
                offering_media_id, media_vehicle_id, media_provider_sow_id, media_provider_sow_line_id,
                slot_date, slot_index, status, insertion_line_id, house_fill_id, held_by, updated_at
              )
              SELECT
                om.id,
                mv.id,
                sow.id,
                psl.id,
                DATEADD('DAY', (week_offset.X - 1) * 7, sow.duration_from),
                slot_idx.X,
                'AVAILABLE',
                NULL,
                NULL,
                NULL,
                CURRENT_TIMESTAMP
              FROM offering_media om
              INNER JOIN media_provider_sow_lines psl ON psl.id = om.media_provider_sow_line_id
              INNER JOIN media_provider_sows sow ON sow.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              CROSS JOIN SYSTEM_RANGE(1, 120) week_offset
              CROSS JOIN SYSTEM_RANGE(1, 10) slot_idx
              WHERE sow.signature_reference = 'esign-provider-msf-olv-001'
                AND om.name = 'Mundo sem fim — YouTube mid-rolls'
                AND mv.capacity_quantity IS NOT NULL
                AND mv.capacity_quantity > 0
                AND slot_idx.X <= mv.capacity_quantity
                AND DATEADD('DAY', (week_offset.X - 1) * 7, sow.duration_from) <= sow.duration_to
                AND NOT EXISTS (
                  SELECT 1 FROM inventory_slots s
                  WHERE s.offering_media_id = om.id
                    AND s.slot_date = DATEADD('DAY', (week_offset.X - 1) * 7, sow.duration_from)
                    AND s.slot_index = slot_idx.X
                );

  - changeSet:
      id: 44
      author: porto-api
      comment: Audience capacity + unit on vehicles and offerings; drop offering daily_audience
      changes:
        - addColumn:
            tableName: media_vehicles
            columns:
              - column:
                  name: audience_capacity
                  type: BIGINT
                  remarks: Audience reach of the face (billboard, digital display). Distinct from inventory capacity_quantity.
              - column:
                  name: audience_capacity_unit
                  type: VARCHAR(32)
                  remarks: PEOPLE_PER_DAY, IMPRESSIONS_PER_DAY, or VEHICLES_PER_DAY. Clients multiply by days for period totals.
        - addColumn:
            tableName: offering_media
            columns:
              - column:
                  name: audience_capacity
                  type: BIGINT
                  remarks: Catalog snapshot of the vehicle audience capacity
              - column:
                  name: audience_capacity_unit
                  type: VARCHAR(32)
                  remarks: Snapshot of vehicle audience_capacity_unit
        - sql:
            sql: |
              UPDATE media_vehicles mv
              SET audience_capacity = (
                    SELECT MAX(psl.exposure)
                    FROM media_provider_sow_lines psl
                    WHERE psl.media_vehicle_id = mv.id AND psl.exposure IS NOT NULL
                  ),
                  audience_capacity_unit = 'PEOPLE_PER_DAY'
              WHERE mv.audience_capacity IS NULL
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  WHERE psl.media_vehicle_id = mv.id AND psl.exposure IS NOT NULL
                );
        - sql:
            sql: |
              UPDATE offering_media
              SET audience_capacity = daily_audience,
                  audience_capacity_unit = 'PEOPLE_PER_DAY'
              WHERE daily_audience IS NOT NULL
                AND audience_capacity IS NULL;
        - sql:
            sql: |
              UPDATE offering_media o
              SET audience_capacity = (
                    SELECT mv.audience_capacity
                    FROM media_provider_sow_lines psl
                    INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                    WHERE psl.id = o.media_provider_sow_line_id
                  ),
                  audience_capacity_unit = (
                    SELECT mv.audience_capacity_unit
                    FROM media_provider_sow_lines psl
                    INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                    WHERE psl.id = o.media_provider_sow_line_id
                  )
              WHERE o.audience_capacity IS NULL
                AND EXISTS (
                  SELECT 1
                  FROM media_provider_sow_lines psl
                  INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                  WHERE psl.id = o.media_provider_sow_line_id
                    AND mv.audience_capacity IS NOT NULL
                );
        - dropColumn:
            tableName: offering_media
            columnName: daily_audience

