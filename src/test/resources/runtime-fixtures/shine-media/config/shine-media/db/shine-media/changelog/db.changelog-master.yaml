              - column:
                  name: detected_extension
                  type: VARCHAR(32)
              - column:
                  name: width_px
                  type: INT
              - column:
                  name: height_px
                  type: INT
              - column:
                  name: duration_seconds
                  type: INT
              - column:
                  name: byte_size
                  type: BIGINT
        - sql:
            sql: |
              INSERT INTO media_provider_sow_line_content_specs (
                media_provider_sow_line_id, media_kind, allowed_extensions,
                width_px, height_px, duration_seconds, duration_tolerance_seconds, max_bytes
              )
              SELECT psl.id, v.media_kind, v.allowed_extensions,
                     v.width_px, v.height_px, v.duration_seconds, v.duration_tolerance_seconds, v.max_bytes
              FROM media_provider_sow_lines psl
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              INNER JOIN (
                SELECT 'Shopping Total LED loop' AS vehicle_name,
                       'VIDEO' AS media_kind, 'mp4' AS allowed_extensions,
                       1920 AS width_px, 1080 AS height_px, 10 AS duration_seconds,
                       0 AS duration_tolerance_seconds, CAST(52428800 AS BIGINT) AS max_bytes
                UNION ALL
                SELECT 'South Bank LED Wall loop', 'VIDEO', 'mp4', 1920, 1080, 10, 0, CAST(52428800 AS BIGINT)
                UNION ALL
                SELECT 'Gazeta do Povo Curitiba — weekend magazine', 'IMAGE', 'png,jpg,jpeg,pdf',
                       NULL, NULL, NULL, 0, CAST(52428800 AS BIGINT)
                UNION ALL
                SELECT 'Melbourne Weekly — 60 pages edition', 'IMAGE', 'png,jpg,jpeg,pdf',
                       NULL, NULL, NULL, 0, CAST(52428800 AS BIGINT)
                UNION ALL
                SELECT 'Flinders St Billboard Face A', 'IMAGE', 'png,jpg,jpeg',
                       NULL, NULL, NULL, 0, CAST(20971520 AS BIGINT)
                UNION ALL
                SELECT 'Av. Paulista Shelter Face', 'IMAGE', 'png,jpg,jpeg',
                       NULL, NULL, NULL, 0, CAST(20971520 AS BIGINT)
              ) v ON v.vehicle_name = mv.name
              WHERE NOT EXISTS (
                SELECT 1 FROM media_provider_sow_line_content_specs s
                WHERE s.media_provider_sow_line_id = psl.id
              )

  - changeSet:
      id: 35
      author: porto-api
      comment: Align seeded slot_monthly_price to indicative market bands (Paulista down, Shopping Total / Gazeta up)
      changes:
        - sql:
            sql: |
              -- Av. Paulista Shelter: 28k BRL was high for a single static face; premium corridor ~20k.
              UPDATE media_provider_sow_lines psl
              SET slot_monthly_price = 20000.00
              WHERE psl.slot_monthly_price = 28000.00
                AND EXISTS (
                  SELECT 1 FROM media_vehicles mv
                  WHERE mv.id = psl.media_vehicle_id
                    AND mv.name = 'Av. Paulista Shelter Face'
                );

              -- Shopping Total LED: 7.2k BRL was soft for a mid mall LED month; mid-premium ~12k.
              UPDATE media_provider_sow_lines psl
              SET slot_monthly_price = 12000.00
              WHERE psl.slot_monthly_price = 7200.00
                AND EXISTS (
                  SELECT 1 FROM media_vehicles mv
                  WHERE mv.id = psl.media_vehicle_id
                    AND mv.name = 'Shopping Total LED loop'
                );

              -- Gazeta weekend magazine: 9.5k BRL was mid-ROB; raise toward blended page (incl. premium positions).
              UPDATE media_provider_sow_lines psl
              SET slot_monthly_price = 12000.00
              WHERE psl.slot_monthly_price = 9500.00
                AND EXISTS (
                  SELECT 1 FROM media_vehicles mv
                  WHERE mv.id = psl.media_vehicle_id
                    AND mv.name = 'Gazeta do Povo Curitiba — weekend magazine'
                );

  - changeSet:
      id: 36
      author: porto-api
      comment: Optional slot_monthly_price on line positions (override line default); seed Gazeta premiums
      changes:
        - addColumn:
            tableName: media_provider_sow_line_positions
            columns:
              - column:
                  name: slot_monthly_price
                  type: DECIMAL(19,4)
                  remarks: Optional rate-card override; null = use provider line slot_monthly_price
        - sql:
            sql: |
              -- Premium print positions on Gazeta weekend magazine (line default remains 12000 BRL).
              -- Mid-book positions (P5, P20, P30, P40) stay NULL → coalesce to line rate.
              UPDATE media_provider_sow_line_positions p
              SET slot_monthly_price = 28000.00
              WHERE UPPER(TRIM(p.position_code)) = 'COVER'
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                  WHERE psl.id = p.media_provider_sow_line_id
                    AND mv.name = 'Gazeta do Povo Curitiba — weekend magazine'
                );

              UPDATE media_provider_sow_line_positions p
              SET slot_monthly_price = 18000.00
              WHERE UPPER(TRIM(p.position_code)) = 'IFC'
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                  WHERE psl.id = p.media_provider_sow_line_id
                    AND mv.name = 'Gazeta do Povo Curitiba — weekend magazine'
                );

              UPDATE media_provider_sow_line_positions p
              SET slot_monthly_price = 15000.00
              WHERE UPPER(TRIM(p.position_code)) = 'P3'
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                  WHERE psl.id = p.media_provider_sow_line_id
                    AND mv.name = 'Gazeta do Povo Curitiba — weekend magazine'
                );

              UPDATE media_provider_sow_line_positions p
              SET slot_monthly_price = 22000.00
              WHERE UPPER(TRIM(p.position_code)) = 'DPS_12_13'
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                  WHERE psl.id = p.media_provider_sow_line_id
                    AND mv.name = 'Gazeta do Povo Curitiba — weekend magazine'
                );

              UPDATE media_provider_sow_line_positions p
              SET slot_monthly_price = 16000.00
              WHERE UPPER(TRIM(p.position_code)) = 'IBC'
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                  WHERE psl.id = p.media_provider_sow_line_id
                    AND mv.name = 'Gazeta do Povo Curitiba — weekend magazine'
                );

              UPDATE media_provider_sow_line_positions p
              SET slot_monthly_price = 22000.00
              WHERE UPPER(TRIM(p.position_code)) = 'OBC'
                AND EXISTS (
                  SELECT 1 FROM media_provider_sow_lines psl
                  INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
                  WHERE psl.id = p.media_provider_sow_line_id
                    AND mv.name = 'Gazeta do Povo Curitiba — weekend magazine'
                );

  - changeSet:
      id: 37
      author: porto-api
      comment: Provider SoW contract_type HOUSE|THIRD_PARTY; nullable services_fee_rate; Shine house inventory seed
      changes:
        - addColumn:
            tableName: media_provider_sows
            columns:
              - column:
                  name: contract_type
                  type: VARCHAR(32)
                  defaultValue: THIRD_PARTY
                  constraints:
                    nullable: false
                  remarks: THIRD_PARTY = external media owner; HOUSE = Shine-owned inventory
        - dropNotNullConstraint:
            tableName: media_provider_sows
            columnName: services_fee_rate
            columnDataType: DECIMAL(19,4)
        - sql:
            sql: |
              UPDATE media_provider_sows
              SET contract_type = 'THIRD_PARTY'
              WHERE contract_type IS NULL OR TRIM(contract_type) = '';
        - sql:
            sql: |
              -- Shine Media as house inventory owner (PROVIDER party; no third-party fee).
              INSERT INTO parties (name, type, address, tax_number_id, business_area_id)
              SELECT 'Shine Media', 'PROVIDER', '1 Shine Media Way, Melbourne VIC AU', 'ABN-SHINE-HOUSE', ba.id
              FROM business_areas ba
              WHERE ba.name = 'Media Owner'
                AND NOT EXISTS (SELECT 1 FROM parties WHERE tax_number_id = 'ABN-SHINE-HOUSE');
        - sql:
            sql: |
              INSERT INTO media_provider_sows (
                creation_date, party_id, duration_from, duration_to, template_id, currency,
                services_fee_rate, signed_by_user_id, signature_reference, signed_sow_url,
                sales_manager_id, status, contract_type
              )
              SELECT TIMESTAMP '2026-08-10 14:00:00',
                     p.id,
                     DATE '2026-08-01',
                     DATE '2027-07-31',
                     t.id,
                     'AUD',
                     NULL,
                     NULL,
                     'house-collins-dooh-001',
                     NULL,
                     NULL,
                     'ACTIVE',
                     'HOUSE'
              FROM parties p
              INNER JOIN media_sow_templates t ON t.name = 'Provider SoW — DOOH' AND t.type = 'PROVIDER'
              WHERE p.tax_number_id = 'ABN-SHINE-HOUSE'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sows s
                  WHERE s.signature_reference = 'house-collins-dooh-001'
                );
        - sql:
            sql: |
              INSERT INTO media_provider_sow_lines (
                media_provider_sow_id, media_channel_id, location_id, slot_duration_minutes,
                media_vehicle_id, number_of_insertions, exposure, slot_monthly_price
              )
              SELECT s.id, ch.id, loc.id, 10, mv.id, 50, 65000, 9000.00
              FROM media_provider_sows s
              INNER JOIN media_channels ch ON ch.name = 'DOOH'
              INNER JOIN media_locations loc ON loc.name = 'Collins St Digital Screen'
              INNER JOIN media_vehicles mv ON mv.name = 'Collins St Digital Screen loop'
              WHERE s.signature_reference = 'house-collins-dooh-001'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sow_lines l
                  WHERE l.media_provider_sow_id = s.id
                    AND l.media_vehicle_id = mv.id
                );
        - sql:
            sql: |
              INSERT INTO offering_media (name, media_provider_sow_line_id, tax_rate)
              SELECT 'Collins St Digital Screen loop — house inventory', psl.id, 0.10
              FROM media_provider_sow_lines psl
              INNER JOIN media_provider_sows s ON s.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              WHERE s.signature_reference = 'house-collins-dooh-001'
                AND mv.name = 'Collins St Digital Screen loop'
                AND NOT EXISTS (
                  SELECT 1 FROM offering_media o
                  WHERE o.name = 'Collins St Digital Screen loop — house inventory'
                );
        - sql:
            sql: |
              INSERT INTO media_provider_sow_line_content_specs (
                media_provider_sow_line_id, media_kind, allowed_extensions,
                width_px, height_px, duration_seconds, duration_tolerance_seconds, max_bytes
              )
              SELECT psl.id, 'VIDEO', 'mp4', 1920, 1080, 10, 0, CAST(52428800 AS BIGINT)
              FROM media_provider_sow_lines psl
              INNER JOIN media_provider_sows s ON s.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              WHERE s.signature_reference = 'house-collins-dooh-001'
                AND mv.name = 'Collins St Digital Screen loop'
                AND NOT EXISTS (
                  SELECT 1 FROM media_provider_sow_line_content_specs spec
                  WHERE spec.media_provider_sow_line_id = psl.id
                );
        - sql:
            sql: |
              -- Anonymous daily slots for house DOOH (capacity_quantity=50) over SoW window.
              INSERT INTO inventory_slots (
                offering_media_id, media_vehicle_id, media_provider_sow_id, media_provider_sow_line_id,
                slot_date, slot_index, status, insertion_line_id, house_fill_id, held_by, updated_at
              )
              SELECT
                om.id,
                mv.id,
                sow.id,
                psl.id,
                DATEADD('DAY', day_offset.X - 1, sow.duration_from),
                slot_idx.X,
                'AVAILABLE',
                NULL,
                NULL,
                NULL,
                CURRENT_TIMESTAMP
              FROM offering_media om
              INNER JOIN media_provider_sow_lines psl ON psl.id = om.media_provider_sow_line_id
              INNER JOIN media_provider_sows sow ON sow.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              CROSS JOIN SYSTEM_RANGE(1, 400) day_offset
              CROSS JOIN SYSTEM_RANGE(1, 100) slot_idx
              WHERE sow.signature_reference = 'house-collins-dooh-001'
                AND om.name = 'Collins St Digital Screen loop — house inventory'
                AND mv.capacity_quantity IS NOT NULL
                AND mv.capacity_quantity > 0
                AND slot_idx.X <= mv.capacity_quantity
                AND DATEADD('DAY', day_offset.X - 1, sow.duration_from) <= sow.duration_to
                AND NOT EXISTS (
                  SELECT 1 FROM inventory_slots s
                  WHERE s.offering_media_id = om.id
                    AND s.slot_date = DATEADD('DAY', day_offset.X - 1, sow.duration_from)
                    AND s.slot_index = slot_idx.X
                );

