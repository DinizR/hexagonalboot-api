  - changeSet:
      id: 42
      author: porto-api
      comment: DOOH exclusive 3-min insertions; operating hours; face monthly = unit × daily capacity (~R$10/insertion)
      changes:
        - addColumn:
            tableName: media_vehicles
            columns:
              - column:
                  name: operating_from
                  type: TIME
                  remarks: Start of daily operating window; equal to operating_to means 24 hours
              - column:
                  name: operating_to
                  type: TIME
                  remarks: End of daily operating window
              - column:
                  name: insertion_duration_minutes
                  type: INT
                  remarks: Exclusive dwell per insertion in minutes; daily capacity = operating minutes / this
        - addColumn:
            tableName: media_provider_sow_lines
            columns:
              - column:
                  name: monthly_price
                  type: DECIMAL(19,4)
                  remarks: Face monthly rate; slot_monthly_price = monthly_price / number_of_insertions
        - sql:
            sql: |
              UPDATE media_vehicles mv
              SET operating_from = TIME '00:00:00',
                  operating_to = TIME '00:00:00',
                  insertion_duration_minutes = 3,
                  capacity_quantity = 480,
                  duration_hint = '3 min insertions',
                  recurrence = 'DAILY'
              WHERE mv.media_channel_id IN (SELECT id FROM media_channels WHERE name = 'DOOH');
        - sql:
            sql: |
              UPDATE media_provider_sow_lines psl
              SET slot_duration_minutes = 3,
                  number_of_insertions = 480,
                  slot_monthly_price = 10.00,
                  monthly_price = 4800.00
              WHERE EXISTS (
                SELECT 1 FROM media_vehicles mv
                INNER JOIN media_channels ch ON ch.id = mv.media_channel_id
                WHERE mv.id = psl.media_vehicle_id AND ch.name = 'DOOH'
              );
        - sql:
            sql: |
              UPDATE media_provider_sow_lines
              SET monthly_price = COALESCE(slot_monthly_price, 0) * COALESCE(number_of_insertions, 0)
              WHERE monthly_price IS NULL;
        - addNotNullConstraint:
            tableName: media_provider_sow_lines
            columnName: monthly_price
            columnDataType: DECIMAL(19,4)
        - sql:
            sql: |
              INSERT INTO inventory_slots (
                offering_media_id, media_vehicle_id, media_provider_sow_id, media_provider_sow_line_id,
                slot_date, slot_index, status, insertion_line_id, house_fill_id, held_by, updated_at
              )
              SELECT
                om.id,
                mv.id,
                sow.id,
                psl.id,
                DATEADD('DAY', day_offset.X - 1, sow.duration_from),
                slot_idx.X,
                'AVAILABLE',
                NULL,
                NULL,
                NULL,
                CURRENT_TIMESTAMP
              FROM offering_media om
              INNER JOIN media_provider_sow_lines psl ON psl.id = om.media_provider_sow_line_id
              INNER JOIN media_provider_sows sow ON sow.id = psl.media_provider_sow_id
              INNER JOIN media_vehicles mv ON mv.id = psl.media_vehicle_id
              INNER JOIN media_channels ch ON ch.id = mv.media_channel_id
              CROSS JOIN SYSTEM_RANGE(1, 800) day_offset
              CROSS JOIN SYSTEM_RANGE(1, 500) slot_idx
              WHERE ch.name = 'DOOH'
                AND UPPER(TRIM(sow.status)) IN ('ACTIVE', 'PENDING')
                AND sow.duration_from IS NOT NULL
                AND sow.duration_to IS NOT NULL
                AND mv.capacity_quantity IS NOT NULL
                AND mv.capacity_quantity > 0
                AND slot_idx.X <= mv.capacity_quantity
                AND DATEADD('DAY', day_offset.X - 1, sow.duration_from) <= sow.duration_to
                AND NOT EXISTS (
                  SELECT 1 FROM inventory_slots s
                  WHERE s.offering_media_id = om.id
                    AND s.slot_date = DATEADD('DAY', day_offset.X - 1, sow.duration_from)
                    AND s.slot_index = slot_idx.X
                );

  - changeSet:
      id: 43
      author: porto-api
      comment: Offering audience metadata; Mundo sem fim YouTube provider SoW
      changes:
        - addColumn:
            tableName: offering_media
            columns:
              - column:
                  name: daily_audience
                  type: BIGINT
                  remarks: People exposed per day (OOH/DOOH panels); copied from line.exposure on create when unset
              - column:
                  name: print_run
                  type: BIGINT
                  remarks: Copies printed per edition (magazines/newspapers)
              - column:
                  name: subscriber_count
                  type: BIGINT
