            columns:
              - column:
                  name: advertiser_contact_user_id
                  type: INT
                  remarks: Advertiser contact for insertion proposal email
              - column:
                  name: proposal_document_url
                  type: VARCHAR(1024)
                  remarks: Latest rendered insertion proposal PDF URL
        - addForeignKeyConstraint:
            baseTableName: media_insertion_sows
            baseColumnNames: advertiser_contact_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_media_insertion_sows_advertiser_contact
        - sql:
            sql: |
              INSERT INTO media_sow_templates (
                type, name, media_channel_id, document_template_url,
                country_code, locale, document_template_key
