      comment: Allocate Standard sales commission to Ageu (adiniz)
      changes:
        - sql:
            sql: |
              INSERT INTO commission_allocations (user_id, commission_id)
              SELECT u.id, sc.id
              FROM users u
              CROSS JOIN sales_commissions sc
              WHERE u.username = 'adiniz'
