  "/media-channels/{id}/icon":
    get:
      tags:
      - MediaChannel
      operationId: downloadMediaChannelIcon
      summary: Download media channel icon
      description: >
        Returns the stored icon from DocumentStorage (filesystem locally, S3 in production)
        at `images/media-channel-icons/{id}/icon.{png|jpg|gif|webp|svg}`
        (`data/shine-media/images/…` locally). Does not proxy an
        external `iconUrl` — only uploaded files.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Icon image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '404':
          description: Channel or uploaded icon not found
    put:
      tags:
      - MediaChannel
      operationId: uploadMediaChannelIcon
      summary: Upload media channel icon
      description: >
        Stores the icon via DocumentStorage (filesystem under `data/shine-media/images`
        locally; S3 in production) at `images/media-channel-icons/{id}/icon.{ext}` and updates
        `iconUrl`. Body may be a raw image or JSON `{ "imageBase64": "...", "contentType": "image/png" }`.
        Type is taken from magic bytes (declared Content-Type must match when present).
        SVG is XML-sanitized (no DTD, script, event handlers, or external hrefs). Raster
        dimensions are read from headers before a full decode. Accepted format, max bytes,
        and pixel size come from `media-channel-crud` YAML (`icon.*`; also
        `GET /media-channels/icon-spec`). Default seed: 128×128 square PNG/WebP (or SVG),
        ≤128 KiB, transparent sRGB. Future client UIs use `iconUrl` / this download for
        channel tiles (YouTube, DOOH, digital display, …).
      parameters:
      - name: id
        in: path
