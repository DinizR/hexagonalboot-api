  /media-provider-sows/esign-complete:
    post:
      tags:
      - MediaProviderSow
      operationId: completeMediaProviderSowEsign
      summary: Manually complete e-sign — store signed PDF, ACTIVE + inventory
      description: Admin/local fallback. Prefer DocuSign Connect POST /media-provider-sows/esign-webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelopeId]
              properties:
                envelopeId:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaProviderSow'
  /media-provider-sows/esign-webhook:
    post:
      tags:
      - MediaProviderSow
      operationId: mediaProviderSowEsignWebhook
      summary: DocuSign Connect listener — HMAC in adapter, then store signed PDF and ACTIVE
      description: |
        Configure this URL on the DocuSign Connect HMAC binding.
        The e-sign-docusign adapter verifies `X-DocuSign-Signature-1` when `docusign.webhookSecret`
        is set, then accepts JSON SIM (`event: envelope-completed`) or classic XML (`EnvelopeStatus=Completed`).
        Other events return `{ "status": "ignored" }`. Already-ACTIVE SoWs are idempotent.
      parameters:
      - name: X-DocuSign-Signature-1
        in: header
        required: false
        schema:
          type: string
        description: Base64 HMAC-SHA256 of the raw body using docusign.webhookSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: envelope-completed
                data:
                  type: object
                  properties:
                    envelopeId:
                      type: string
          application/xml:
            schema:
              type: string
      responses:
        '201':
          description: Envelope completed (SoW ACTIVE) or notification ignored
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MediaProviderSow'
                - type: object
                  properties:
                    status:
                      type: string
                      example: ignored
