security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BusinessArea:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
    CreateAuthTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          description: password today; authorization_code when a Keycloak IdP is loaded
          default: password
        username:
          type: string
        password:
          type: string
          format: password
        refresh_token:
          type: string
      required:
      - username
      - password
    AuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
