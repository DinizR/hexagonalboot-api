          description: Template metadata with updated emailTemplateUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Not UTF-8 HTML, over html.maxBytes, binary payload, missing html root, or no emailTemplateKey
