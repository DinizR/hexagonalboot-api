  /cash-flows:
    get:
      tags:
      - CashFlow
      operationId: listCashFlow
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 8
      - name: accountId
        in: query
        schema:
          type: integer
      - name: sowType
        in: query
        description: INSERTION, PROVIDER, or CREATIVE
        schema:
          type: string
      - name: sowId
        in: query
        schema:
          type: integer
      - name: type
        in: query
        description: >
          Optional. PAYABLE or RECEIVABLE. Omit to return both in the same page;
          together they are the company position for the window.
        schema:
          type: string
      - name: status
        in: query
        description: >
          Optional. FORECAST or ACTUAL. Omit to return both in the same page;
          the two statuses are not mutually exclusive.
        schema:
          type: string
      - name: seriesId
        in: query
        description: Group id of a generated forecast series
        schema:
          type: string
      - name: from
        in: query
        description: Inclusive dueDate start (yyyy-MM-dd). Omit for no lower bound.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive dueDate end (yyyy-MM-dd). Omit for no upper bound.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowPageResponse'
