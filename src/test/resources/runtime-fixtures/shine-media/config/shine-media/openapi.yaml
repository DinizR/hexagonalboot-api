    MediaProviderSow:
      type: object
      properties:
        id:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        partyId:
          type: integer
          format: int32
        durationFrom:
          type: string
          format: date
        durationTo:
          type: string
          format: date
        templateId:
          type: integer
          format: int32
        currency:
          type: string
        servicesFeeRate:
          type: number
          nullable: true
          description: >
            Shine Media fee on a THIRD_PARTY provider contract. Null on HOUSE
            (Shine owns the inventory; this fee is only taken from third-party providers).
            Applied to net sold Insertion value before tax (e.g. 10% of R$ 100 when the
            advertiser pays R$ 100 + ISS R$ 5); provider receives the balance and remits tax.
        signedByUserId:
          type: integer
          format: int32
        signatureReference:
          type: string
        signedSowUrl:
          type: string
        salesManagerId:
          type: integer
          format: int32
          nullable: true
          description: Origin sales manager; must be null on HOUSE contracts
        status:
          type: string
          description: >
            PENDING_APPROVAL (awaiting supervisor), APPROVED (may send-proposal),
            PROPOSAL (emailed to partner), DRAFT (awaiting e-sign), PENDING, ACTIVE, CANCELLED
        contractType:
          type: string
          enum: [THIRD_PARTY, HOUSE]
          description: >
            THIRD_PARTY = external media owner; HOUSE = Shine-owned inventory
            (no provider payable / no servicesFeeRate / no origin sales manager).
        envelopeId:
          type: string
          nullable: true
          description: DocuSign or stub envelope id while awaiting dual sign
        draftDocumentUrl:
          type: string
          nullable: true
          description: Storage URL/key for the unsigned draft PDF
        paymentDayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
          description: Day of month Shine pays the provider (monthly). Defaults to 5.
        providerContactUserId:
          type: integer
          format: int32
          nullable: true
          description: >
            User on the provider party who is the commercial contact for proposals
            (name and email come from that user).
        proposalDocumentUrl:
          type: string
          nullable: true
          description: Storage URL of the latest partnership proposal PDF
        latePaymentFineRate:
          type: number
          description: >
            Fraction of an overdue remittance charged as a late-payment fine
            (0.02 = 2%). Default 0.02. Included in the signed SoW contract.
    CreateMediaProviderSowRequest:
      type: object
      properties:
        creationDate:
          type: string
          format: date-time
        partyId:
          type: integer
          format: int32
        durationFrom:
          type: string
          format: date
        durationTo:
          type: string
          format: date
        templateId:
          type: integer
          format: int32
        currency:
          type: string
        servicesFeeRate:
          type: number
          nullable: true
          description: >
            Required for THIRD_PARTY; must be omitted/null for HOUSE. Fee applies to net sold
            Insertion value before tax (not tax charged to the advertiser).
        signedByUserId:
          type: integer
          format: int32
        signatureReference:
          type: string
        signedSowUrl:
          type: string
        salesManagerId:
          type: integer
          format: int32
        status:
          type: string
          description: >
            On create, HOUSE is forced to ACTIVE (inventory generated).
            THIRD_PARTY is always PENDING_APPROVAL (cannot create as ACTIVE, APPROVED, or CANCELLED).
            Supervisor POST …/approve-proposal before send-proposal.
        contractType:
          type: string
          enum: [THIRD_PARTY, HOUSE]
        envelopeId:
          type: string
          nullable: true
        draftDocumentUrl:
          type: string
          nullable: true
        paymentDayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
          description: Day of month Shine pays the provider. Omit to use system default (5).
        providerContactUserId:
          type: integer
          format: int32
          nullable: true
        proposalDocumentUrl:
          type: string
          nullable: true
        latePaymentFineRate:
          type: number
          description: Fraction of an overdue remittance charged as a late-payment fine (0.02 = 2%). Default 0.02.
      required:
      - creationDate
      - partyId
      - durationFrom
      - durationTo
      - templateId
      - currency
      - status
      - contractType
