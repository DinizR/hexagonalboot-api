  "/inventory-slots/{id}/media-contents":
    get:
      tags:
      - InsertionMediaContent
      operationId: listInventorySlotMediaContents
      summary: List media artefacts for one insertion slot (1:N)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertionMediaContentPageResponse'
        '404':
          description: Slot not found
    post:
      tags:
      - InsertionMediaContent
      operationId: uploadInventorySlotMediaContent
      summary: Upload a media artefact for this slot (client or design team)
      description: >
        Slot must be WAITING_FOR_PARTNER_MEDIA or MEDIA_INSERTED (`held_by = INSERTION`).
        One slot holds many artefacts. Body may be raw bytes (query `name`, `source`,
        `filename`, `slotDurationMinutes`) or JSON
        `{ "name", "source": "CLIENT"|"DESIGN_TEAM", "fileBase64", "contentType" }`
        or `{ "name", "source", "storageLocationUrl" }` for an allowlisted CDN URL.
        Uploaded files are stored via DocumentStorage at
        `media-artefacts/{slotId}/{contentId}.{ext}`
        (`data/shine-media/media-artefacts/…` locally, same key on S3).
        First artefact on a waiting slot moves it to MEDIA_INSERTED. Validated against
        the offering’s provider-line contentSpec.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: name
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
          enum: [CLIENT, DESIGN_TEAM]
      - name: filename
        in: query
        schema:
          type: string
      - name: slotDurationMinutes
        in: query
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInsertionMediaContentRequest'
      responses:
        '201':
          description: Artefact stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertionMediaContent'
        '400':
          description: Slot not waiting/inserted, spec mismatch, or empty body
