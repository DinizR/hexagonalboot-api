  "/cash-flows/{id}/settle":
    post:
      tags:
      - CashFlow
      operationId: settleCashFlow
      description: >
        Pay a payable or receive a receivable. Sets effectiveDate, effectiveValue,
        fineValue, and status ACTUAL. Rejects a row that already has effectiveDate.
        When effectiveDate is after dueDate and fineValue is omitted, fineValue is
        originalValue × the linked SoW latePaymentFineRate (0 if there is no SoW).
        When effectiveValue is omitted it is originalValue + fineValue.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleCashFlowRequest'
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlow'
        '400':
          description: Already settled, or invalid effectiveDate / amounts
        '404':
          description: Cash flow not found
