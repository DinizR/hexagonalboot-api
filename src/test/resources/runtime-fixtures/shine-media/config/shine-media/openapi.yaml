  "/media-provider-sows/{id}/send-for-sign":
    post:
      tags:
      - MediaProviderSow
      operationId: sendMediaProviderSowForSign
      summary: Store draft PDF, create dual-sign envelope (DocuSign or stub), record sow_signatures
      description: >
        THIRD_PARTY APPROVED, DRAFT, or PENDING. A commercial proposal cannot be skipped
        past supervisor approval: create starts as PENDING_APPROVAL; POST …/approve-proposal
        then either send-proposal (partner email) or send-for-sign from APPROVED.
        After accept-proposal the SoW is DRAFT. If documentPdf is omitted,
        renders the SoW HTML selected by media-provider-sow-crud YAML
        `template.{mediaType}.{country}.sow` (media type comes from the SoW template’s channel).
        DocuSign emails signers; optional notifyEmail uses SMTP. HOUSE SoWs skip this path.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMediaProviderSowForSignRequest'
      responses:
        '200':
          description: SoW updated with envelopeId and draftDocumentUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaProviderSow'
  "/media-provider-sows/{id}/approve-proposal":
    post:
      tags:
      - MediaProviderSow
      operationId: approveMediaProviderSowProposal
      summary: Supervisor approval (PENDING_APPROVAL → APPROVED) required before send-proposal
      description: >
        THIRD_PARTY PENDING_APPROVAL only. HOUSE SoWs skip this path. After approval the
        sales manager may POST …/send-proposal (emails the partner) or POST …/send-for-sign
        (skip commercial email). Unapproved SoWs cannot be sent to the partner.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: SoW status is APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaProviderSow'
  "/media-provider-sows/{id}/send-proposal":
    post:
      tags:
      - MediaProviderSow
      operationId: sendMediaProviderSowProposal
      summary: Render proposal PDF, store it, email the provider contact with the PDF attached
      description: >
        THIRD_PARTY APPROVED (first send) or PROPOSAL (resend) only. Renders the proposal PDF and email HTML selected by
        media-provider-sow-crud YAML `template.{mediaType}.{country}.proposal` and `.email`
        (media type from the SoW template’s channel; `proposalTemplateId` overrides the PDF row).
        Stores `provider-sows/{id}/proposal.pdf` (and a dated snapshot), emails the responsible
        person with the PDF attached (signed by the SoW sales manager: name, phone, email from
        that user), and sets status to PROPOSAL. HOUSE SoWs skip this path. Contact comes from
        providerContactUserId unless overridden. Returns HTTP 400 if status is still PENDING_APPROVAL.
      parameters:
