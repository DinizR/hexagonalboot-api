          type: integer
      responses:
        '200':
          description: Deleted
  "/templates/{id}/document":
    get:
      tags:
      - Template
      operationId: downloadTemplateDocument
      summary: Download SoW HTML template
      description: >
        Returns the stored HTML from DocumentStorage (filesystem locally, S3 in production)
        at `sow-templates/{documentTemplateKey}.html` (locally
        `data/shine-media/templates/{key}.html`). That file is the latest version for
        the key; catalog `id` is not part of the path. Missing HTML is 404 — upload via PUT.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: HTML template
          content:
            text/html:
              schema:
                type: string
                format: binary
        '404':
          description: Template metadata or HTML not found
    put:
      tags:
      - Template
      operationId: uploadTemplateDocument
      summary: Upload SoW HTML template
      description: >
        Overwrites the shared HTML for this row’s `documentTemplateKey` via DocumentStorage
        (`sow-templates/{key}.html`; locally `data/shine-media/templates/{key}.html`;
        S3 in production) and updates `documentTemplateUrl`. Every catalog row with the
        same key uses this file. Body may be raw HTML (`text/html`) or JSON `{ "html": "..." }`.
        Payload is UTF-8 HTML with an `<html>` root, at most `html.maxBytes` on `template-crud`
        YAML (default 512 KiB). Binary types are rejected. Active content (`script`, event
        handlers, `javascript:` URLs) is stripped; Thymeleaf `th:*` attributes and `${...}`
        expressions are kept. `send-for-sign` uses this stored file.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          text/html:
            schema:
              type: string
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTemplateDocumentRequest'
      responses:
        '200':
          description: Template metadata with updated documentTemplateUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Not UTF-8 HTML, over html.maxBytes, binary payload, or missing html root
  "/templates/{id}/email-document":
    get:
      tags:
      - Template
      operationId: downloadTemplateEmailDocument
      summary: Download proposal email HTML template
      description: >
        Returns stored HTML at `sow-templates/{emailTemplateKey}.html`
        (locally `data/shine-media/templates/{key}.html`). Missing HTML is 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
