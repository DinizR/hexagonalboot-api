                $ref: '#/components/schemas/ScheduledJobPageResponse'
    post:
      tags:
      - ScheduledJob
      operationId: createScheduledJob
      summary: Persist a schedule and provision it into the host scheduler
      description: >
        `jobId` must match a loaded `scheduled-jobs` plugin id (for example `heartbeat`).
        `cronExpression` is a Quartz 6/7-field cron. Parameters are persisted as key/value
        rows and passed to the plugin when the trigger fires. Unknown jobId or invalid cron
        returns HTTP 400. The row is the source of truth; Quartz RAM jobs are rebuilt on API start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledJobRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledJob'
        '400':
          description: Unknown jobId or invalid cronExpression
  /scheduled-jobs/search:
    get:
      tags:
      - ScheduledJob
      operationId: searchScheduledJob
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledJob'
  "/scheduled-jobs/{id}/run":
    post:
      tags:
      - ScheduledJob
      operationId: runScheduledJob
      summary: Run one persisted schedule immediately
      description: >
        Executes the loaded scheduled-jobs plugin for this row, using the stored parameters.
        Does not wait for the cron and does not change the trigger. `enabled=false` still runs.
        Unknown jobId returns HTTP 400. Missing id returns HTTP 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Job finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ran
                  id:
                    type: string
                  jobId:
                    type: string
        '400':
          description: Unknown jobId
        '404':
          description: Schedule not found
