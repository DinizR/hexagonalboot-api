- name: MediaLocation
- name: OfferingMedia
- name: InventorySlot
  description: Edition × capacity/position bookable units on an offering; list, summary, generate, CRUD
- name: HouseFill
  description: Non-commercial fill that holds inventory slots while ACTIVE
- name: CreativeService
- name: CreativeServiceRate
- name: Party
- name: CompanyLegalEntity
  description: Company legal/tax identity per country for SoW PDFs
- name: Template
  description: Catalog of SoW, proposal, and proposal-email HTML (channel × country × type)
- name: PaymentCondition
- name: ScheduledJob
  description: >
    Persisted cron schedules provisioned into the host JobScheduler (Quartz in porto-api; plugins never see Quartz).
    Seeded job `slot-execution-alert` runs at midnight (`0 0 0 * * ?`) and emails incomplete insertion slots.
    Parameters: `daysBefore` (initial 15) and `administratorEmail` (initial rodrigo.dinis@outlook.com).
- name: MediaProviderSow
  description: Provider contract; ACTIVE generates inventory slots, CANCELLED withdraws AVAILABLE
- name: MediaProviderSowLine
- name: MediaProviderSowLinePosition
  description: Declared bookable positions on a provider line (print pages, breaks, rolls, zones)
- name: MediaCreativeSow
- name: CreativeServiceLine
- name: CreativeDeliverable
- name: MediaInsertionSow
  description: >
    Advertiser insertion contract. Soft-reserves inventory while PENDING_APPROVAL,
    APPROVED, PROPOSAL, PENDING, or ACTIVE. Supervisor must approve before send-proposal.
- name: InsertionLine
  description: Allocates number_of_insertions inventory slots in the SoW date window
- name: InsertionMediaContent
- name: ProviderMediaContent
- name: ContractExecutionEvidence
- name: Account
  description: Chart of accounts for cash-flow posting (revenue and expense)
- name: CashFlow
- name: User
- name: Role
- name: RolePermission
- name: UserRole
paths:
  /auth/token:
    post:
      tags:
      - Auth
      operationId: createAuthToken
      security: []
      summary: Issue an access token
      description: >
        Local IdP password grant. The host signs a JWT. Use the access_token
        as a Bearer token on every other API call. Switch
        `porto.api.auth.identity-provider` to a Keycloak plugin later; this
        path stays the same.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthTokenRequest'
            example:
              grant_type: password
              username: admin
              password: changeme
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid credentials
  /auth/password:
    post:
      tags:
      - Auth
      operationId: updateAuthPassword
      summary: Change the current user's local password
      description: >
        Requires a bearer token from `POST /auth/token`. Works when the
        bootstrap password has expired. Verifies `current_password`, stores a
        bcrypt hash, clears `users.password_expires_at`, and returns a new
        access token. Not used when a Keycloak IdP is loaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthPasswordRequest'
            example:
              current_password: changeme
              new_password: replace-this-password
      responses:
        '200':
          description: Password changed and a new access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: New password is missing, too short, or unchanged
        '401':
          description: Missing token or current password is wrong
