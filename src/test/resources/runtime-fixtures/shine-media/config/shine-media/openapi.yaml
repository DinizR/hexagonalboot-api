        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMediaProviderSowProposalRequest'
      responses:
        '200':
          description: SoW updated with proposalDocumentUrl and status PROPOSAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaProviderSow'
  "/media-provider-sows/{id}/accept-proposal":
    post:
      tags:
      - MediaProviderSow
      operationId: acceptMediaProviderSowProposal
      summary: Accept a commercial proposal (PROPOSAL → DRAFT) so send-for-sign can run
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: SoW status is DRAFT
          content:
