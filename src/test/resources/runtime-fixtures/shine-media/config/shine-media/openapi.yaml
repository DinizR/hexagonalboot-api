      tags:
      - MediaInsertionSow
      operationId: approveMediaInsertionSowProposal
      summary: Supervisor approval (PENDING_APPROVAL → APPROVED) required before send-proposal
      description: >
        PENDING_APPROVAL only. FORECAST cash-flow rows for this SoW become ACTUAL.
        After approval the sales manager may POST …/send-proposal
        to email the advertiser. Unapproved SoWs cannot be sent to the client.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: SoW status is APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInsertionSow'
  "/media-insertion-sows/{id}/send-proposal":
    post:
      tags:
      - MediaInsertionSow
      operationId: sendMediaInsertionSowProposal
      summary: Render proposal PDF, store it, email the advertiser contact with the PDF attached
      description: >
        APPROVED (first send) or PROPOSAL (resend) only. Resolves INSERTION_PROPOSAL (+ email HTML) by the SoW
        INSERTION template’s media channel and country (`proposalTemplateId` overrides).
        Stores `insertion-sows/{id}/proposal.pdf` (and a dated snapshot), emails the
        advertiser contact with the PDF attached (signed by the SoW sales manager), and
        sets status to PROPOSAL. Contact comes from advertiserContactUserId unless overridden.
        Returns HTTP 400 if status is still PENDING_APPROVAL.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMediaInsertionSowProposalRequest'
      responses:
        '200':
          description: SoW updated with proposalDocumentUrl and status PROPOSAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInsertionSow'
