    MediaChannelIconSpec:
      type: object
      description: >
        Icon rules from `media-channel-crud` plugin YAML (`icon.*`). Raster uploads must
        satisfy pixel flags after magic-byte type sniff and header size read. SVG skips
        pixel checks and is XML-sanitized (no script/DTD/external href).
      properties:
        contentTypes:
          type: array
          items:
            type: string
          example: ["image/png", "image/webp", "image/svg+xml"]
        extensions:
          type: array
          items:
            type: string
          example: ["png", "webp", "svg"]
        maxBytes:
          type: integer
          example: 131072
        widthPx:
          type: integer
          example: 128
        heightPx:
          type: integer
          example: 128
        minWidthPx:
          type: integer
        minHeightPx:
          type: integer
        maxWidthPx:
          type: integer
        maxHeightPx:
          type: integer
        requireSquare:
          type: boolean
        requireExactPixels:
          type: boolean
        background:
          type: string
          example: transparent
        colorSpace:
          type: string
          example: sRGB
    UploadMediaChannelIconRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Raw icon bytes, Base64-encoded
        contentType:
          type: string
          description: Must be one of `GET /media-channels/icon-spec` contentTypes
          example: image/png
      required:
      - imageBase64
