openapi: 3.0.3
info:
  title: Shine Media API
  version: 1.0.0
  description: |
    CRUD API for the shine-media domain model.

    Sellable capacity is materialized as `inventory_slots` per offering
    (`AVAILABLE` / `USED` / `CANCELLED`), by edition date from vehicle recurrence.
    Optional provider-line positions (pages, breaks, rolls) set `position_code`
    (with per-position `capacity` for multi-insertion pages).     Provider line `minutePrice` is the rate per exclusive minute on time-based
    (DOOH) inventory; the buyer selects `durationMinutes` per insertion and the
    unit price is duration × minutePrice. Each inventory slot is one exclusive
    minute. `slotMonthlyPrice` remains the indicative price of one insertion at
    the catalogue default duration, and optional per-position `slotMonthlyPrice`
    overrides it for print (`coalesce(position, line)`).
    Provider SoWs are `THIRD_PARTY` or `HOUSE` (Shine-owned inventory: no
    `servicesFeeRate`, no origin sales manager, no `PROVIDER_FEE` payable).
    Provider lines declare a content format spec (`contentSpec`); insertion/provider
    media content URLs are probed and must match that spec.
    Insertion lines and ACTIVE house fills allocate slots atomically; insufficient
    inventory returns HTTP 409.     Cash-flow rows post to a chart of `accounts`
    (SoW revenue and manual expenses; optional SoW link). Recurring forecasts
    (`POST /cash-flows/forecast`) expand a configurable interval into
    `FORECAST` rows.     Insertion SoWs in `PENDING_APPROVAL` post `FORECAST` receivables and
    payables; supervisor approval (`APPROVED`) updates those rows to `ACTUAL`.
    `POST /cash-flows/{id}/settle` records a payment or receipt (`effectiveDate`,
    optional `effectiveValue` / `fineValue`). Overdue settle applies the SoW
    `latePaymentFineRate` (default 2%) to `originalValue`.
    Cron schedules (`/scheduled-jobs`) persist a plugin

    Authentication (local IdP): `POST /auth/token` with
    `{"grant_type":"password","username":"admin","password":"changeme"}`.
    Seeded `admin` / `adiniz` start with bcrypt password `changeme`, already
    expired (`must_change_password: true`). Other API calls return 403 until
    `POST /auth/password` with the current and a new password. The host then
    returns a JWT that can be sent as `Authorization: Bearer <access_token>`.
    Create/update user may set `password`; the host stores a bcrypt hash on
    `users.password_hash` and expires that password. A future Keycloak plugin
    replaces `local-idp` without changing these routes.
    `jobId`, Quartz cron, and key/value parameters; the host provisions RAM
    Quartz at startup. Domain model:
    `config/shine-media/db/README.md`.
