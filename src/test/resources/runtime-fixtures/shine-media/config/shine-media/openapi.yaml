  /inventory-slots:
    get:
      tags:
      - InventorySlot
      operationId: listInventorySlot
      summary: List inventory slots (optional period and status)
      description: >
        Without filters, returns a page of all slots. With `from` and `to`, filters by
        `slot_date` inclusive. Optional `status` further narrows the period (or requires
        `from`/`to` when used alone). Same statuses as offering-scoped list.
      parameters:
      - name: from
        in: query
        description: Inclusive start of slot_date range (required with to/status filters)
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive end of slot_date range (required with from/status filters)
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
          enum: [AVAILABLE, USED, CANCELLED, SOLD, WAITING_FOR_PARTNER_MEDIA, MEDIA_INSERTED, MEDIA_APPROVED, MEDIA_DEPLOYED, MEDIA_EXECUTED]
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySlotPageResponse'
        '400':
          description: Missing from/to when filtering, to before from, or unknown status
