    post:
      tags:
      - InventorySlot
      operationId: executeInventorySlotMedia
      summary: MEDIA_DEPLOYED → MEDIA_EXECUTED (final)
      description: >
        The insertion ran at the slot’s configured time. `slotDate` must not be in the future.
        Final state — cannot be freed back to AVAILABLE.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Media executed
