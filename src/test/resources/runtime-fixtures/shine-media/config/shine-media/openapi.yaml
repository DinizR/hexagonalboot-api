    MediaProviderSowLine:
      type: object
      properties:
        id:
          type: integer
          format: int32
        mediaProviderSowId:
          type: integer
          format: int32
        mediaChannelId:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        slotDurationMinutes:
          type: integer
          format: int32
          description: Catalogue default exclusive duration in minutes. The buyer may book a different duration.
        mediaVehicleId:
          type: integer
          format: int32
        numberOfInsertions:
          type: integer
          format: int32
          description: Daily capacity. On DOOH this is exclusive minutes per day (one inventory slot per minute).
        exposure:
          type: integer
          format: int32
        slotMonthlyPrice:
          type: number
          description: >
            Indicative unit rate for one insertion at the catalogue default duration
            (minutePrice × slotDurationMinutes when the line is priced per minute).
            Kept as a catalog figure. Client quote on time-based offerings is
            durationMinutes × minutePrice.
        minutePrice:
          type: number
          description: >
            Rate per exclusive minute. When set, the buyer selects durationMinutes
            and the insertion unit price is duration × minutePrice. Inventory is
            one slot per exclusive minute.
        monthlyPrice:
          type: number
          description: >
            Catalog face total. Kept when sent together with a unit rate;
            otherwise derived as minutePrice × numberOfInsertions (daily exclusive
            minutes) or slotMonthlyPrice × numberOfInsertions.
        contentSpec:
          $ref: '#/components/schemas/MediaProviderSowLineContentSpec'
