    InventorySlot:
      type: object
      properties:
        id:
          type: integer
        offeringMediaId:
          type: integer
        mediaVehicleId:
          type: integer
        mediaProviderSowId:
          type: integer
        mediaProviderSowLineId:
          type: integer
        slotDate:
          type: string
          format: date
        slotIndex:
          type: integer
        positionCode:
          type: string
          description: Optional identity (e.g. COVER, P5, MID_1); null = anonymous capacity index
        status:
          type: string
          enum: [AVAILABLE, USED, CANCELLED, SOLD, WAITING_FOR_PARTNER_MEDIA, MEDIA_INSERTED, MEDIA_APPROVED, MEDIA_DEPLOYED, MEDIA_EXECUTED]
          description: >
            AVAILABLE = bookable. CANCELLED = withdrawn. USED = house fill hold.
            Insertion fulfillment: SOLD → WAITING_FOR_PARTNER_MEDIA → MEDIA_INSERTED →
            MEDIA_APPROVED → MEDIA_DEPLOYED → MEDIA_EXECUTED.
        insertionLineId:
          type: integer
        houseFillId:
          type: integer
        heldBy:
          type: string
          enum: [INSERTION, HOUSE_FILL]
        updatedAt:
          type: string
          format: date-time
    CreateInventorySlotRequest:
      type: object
      properties:
        offeringMediaId:
          type: integer
        mediaVehicleId:
          type: integer
        mediaProviderSowId:
          type: integer
        mediaProviderSowLineId:
          type: integer
        slotDate:
          type: string
          format: date
        slotIndex:
          type: integer
        positionCode:
          type: string
        status:
          type: string
        insertionLineId:
          type: integer
        houseFillId:
          type: integer
        heldBy:
          type: string
      required:
      - offeringMediaId
      - mediaVehicleId
      - mediaProviderSowId
      - mediaProviderSowLineId
      - slotDate
      - slotIndex
      - status
    UpdateInventorySlotRequest:
      type: object
      properties:
        status:
          type: string
          enum: [AVAILABLE, CANCELLED]
          description: >
            Withdraw (CANCELLED) or free (AVAILABLE). Insertion fulfillment uses
            POST /inventory-slots/{id}/wait-for-partner-media, approve-media,
            reject-media, deploy-media, execute-media.
      required:
      - status
