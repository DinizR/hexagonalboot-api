# Shine Media application (dev) — overrides framework defaults from application.yml / api-dev.yml.

spring:
  application:
    name: shine-media
  datasource:
    # Connect to embedded H2 TCP server (started in PortoApiApplication.main for dev).
    url: jdbc:h2:tcp://127.0.0.1:9092/shine-media
    driver-class-name: org.h2.Driver
    username: shine-media
    password: shine-media
  h2:
    console:
      enabled: true
  liquibase:
    # Migrations run per database from the datasource plugin (liquibase.change-log).
    enabled: false

porto:
  api:
    auth:
      required: true
      identity-provider: local-idp
      jwt:
        issuer: shine-media
        secret: shine-media-local-jwt-secret-32b-min
        time-to-live: PT8H
