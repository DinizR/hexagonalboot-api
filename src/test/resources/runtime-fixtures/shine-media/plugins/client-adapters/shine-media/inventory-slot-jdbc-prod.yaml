                 SUM(CASE WHEN UPPER(TRIM(status)) = 'AVAILABLE' THEN 1 ELSE 0 END) AS available_cnt,
                 SUM(CASE WHEN UPPER(TRIM(status)) NOT IN ('AVAILABLE', 'CANCELLED') THEN 1 ELSE 0 END) AS used_cnt,
                 SUM(CASE WHEN UPPER(TRIM(status)) = 'CANCELLED' THEN 1 ELSE 0 END) AS cancelled_cnt
          FROM inventory_slots
