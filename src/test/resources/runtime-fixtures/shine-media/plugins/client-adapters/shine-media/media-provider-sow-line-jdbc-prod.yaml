configs:
  - key: datasource
    value: shine-media
  - key: sql.dialect
    value: h2

queries:
  - dialect: h2
    statements:
      - name: LIST_MEDIA_PROVIDER_SOW_LINE
        sql: |
          SELECT l.id, l.media_provider_sow_id, l.media_channel_id, l.location_id, l.slot_duration_minutes,
                 l.media_vehicle_id, l.number_of_insertions, l.exposure, l.slot_monthly_price, l.minute_price, l.monthly_price,
                 s.id AS content_spec_id, s.media_kind, s.allowed_extensions,
                 s.width_px AS content_width_px, s.height_px AS content_height_px,
                 s.duration_seconds AS content_duration_seconds,
                 s.duration_tolerance_seconds, s.max_bytes
          FROM media_provider_sow_lines l
          LEFT JOIN media_provider_sow_line_content_specs s ON s.media_provider_sow_line_id = l.id
          ORDER BY l.id
          LIMIT ? OFFSET ?
      - name: COUNT_MEDIA_PROVIDER_SOW_LINE
        sql: |
          SELECT COUNT(*) FROM media_provider_sow_lines
      - name: READ_MEDIA_PROVIDER_SOW_LINE
        sql: |
          SELECT l.id, l.media_provider_sow_id, l.media_channel_id, l.location_id, l.slot_duration_minutes,
                 l.media_vehicle_id, l.number_of_insertions, l.exposure, l.slot_monthly_price, l.minute_price, l.monthly_price,
                 s.id AS content_spec_id, s.media_kind, s.allowed_extensions,
                 s.width_px AS content_width_px, s.height_px AS content_height_px,
                 s.duration_seconds AS content_duration_seconds,
                 s.duration_tolerance_seconds, s.max_bytes
          FROM media_provider_sow_lines l
          LEFT JOIN media_provider_sow_line_content_specs s ON s.media_provider_sow_line_id = l.id
          WHERE l.id = ?
      - name: SEARCH_MEDIA_PROVIDER_SOW_LINE
        sql: |
          SELECT l.id, l.media_provider_sow_id, l.media_channel_id, l.location_id, l.slot_duration_minutes,
                 l.media_vehicle_id, l.number_of_insertions, l.exposure, l.slot_monthly_price, l.minute_price, l.monthly_price,
                 s.id AS content_spec_id, s.media_kind, s.allowed_extensions,
                 s.width_px AS content_width_px, s.height_px AS content_height_px,
                 s.duration_seconds AS content_duration_seconds,
                 s.duration_tolerance_seconds, s.max_bytes
          FROM media_provider_sow_lines l
          LEFT JOIN media_provider_sow_line_content_specs s ON s.media_provider_sow_line_id = l.id
          ORDER BY l.id
      - name: INSERT_MEDIA_PROVIDER_SOW_LINE
        sql: |
          INSERT INTO media_provider_sow_lines (media_provider_sow_id, media_channel_id, location_id, slot_duration_minutes, media_vehicle_id, number_of_insertions, exposure, slot_monthly_price, minute_price, monthly_price)
          VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
      - name: UPDATE_MEDIA_PROVIDER_SOW_LINE
        sql: |
          UPDATE media_provider_sow_lines
          SET media_provider_sow_id = ?, media_channel_id = ?, location_id = ?, slot_duration_minutes = ?, media_vehicle_id = ?, number_of_insertions = ?, exposure = ?, slot_monthly_price = ?, minute_price = ?, monthly_price = ?
          WHERE id = ?
      - name: DELETE_MEDIA_PROVIDER_SOW_LINE
        sql: |
          DELETE FROM media_provider_sow_lines WHERE id = ?
      - name: UPSERT_MEDIA_PROVIDER_SOW_LINE_CONTENT_SPEC
        sql: |
          MERGE INTO media_provider_sow_line_content_specs (media_provider_sow_line_id, media_kind, allowed_extensions, width_px, height_px, duration_seconds, duration_tolerance_seconds, max_bytes)
          KEY (media_provider_sow_line_id)
          VALUES (?, ?, ?, ?, ?, ?, ?, ?)

      - name: READ_CONTENT_SPEC_BY_LINE
        sql: |
          SELECT id, media_provider_sow_line_id, media_kind, allowed_extensions,
                 width_px, height_px, duration_seconds, duration_tolerance_seconds, max_bytes
          FROM media_provider_sow_line_content_specs
          WHERE media_provider_sow_line_id = ?
      - name: RESOLVE_PROVIDER_LINE_FOR_INSERTION_LINE
        sql: |
          SELECT om.media_provider_sow_line_id
          FROM insertion_lines il
          INNER JOIN offering_media om ON om.id = il.offering_media_id
          WHERE il.id = ?

