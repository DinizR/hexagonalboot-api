connectors:
  - id: DB
    adapter: media-provider-sow-jdbc
  - id: STORAGE
    adapter: document-storage-s3
  - id: ESIGN
    adapter: e-sign-docusign
  - id: EMAIL
    adapter: email-smtp
  - id: RENDER
    adapter: document-render-thymeleaf
  - id: PARTY
    adapter: party-jdbc
  - id: TEMPLATE
    adapter: template-jdbc
  - id: CHANNEL
    adapter: media-channel-jdbc
  - id: LEGAL
    adapter: company-legal-entity-jdbc
